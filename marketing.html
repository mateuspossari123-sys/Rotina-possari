<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Marketing 30 Anos</title>
<link rel="manifest" href="manifest-marketing.json">
<meta name="theme-color" content="#06283a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-mkt-192.png">
<link rel="apple-touch-icon" href="icon-mkt-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marketing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* Identidade visual "30 anos — Alcançados pela Misericórdia" */
  :root {
    --navy: #06283a;
    --blue: #1c5170;
    --blue-light: #4483a3;
    --gold-1: #f3cf8f;
    --gold-2: #c9a24f;
    --gold-3: #a07a20;
    --gold-grad: linear-gradient(100deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    --cream: #fdeee0;
    --bg-page: #f7ebde;
    --bg-app: var(--cream);
    --card: #fffaf4;
    --line: #eedcc8;
    --input: #fffdfa;
    --input-line: #e3c9aa;
    --soft: #f6e4cf;
    --primary: var(--blue);
    --accent: var(--gold-3);
    --ok: #2f7d5b;
    --danger: #b4432f;
    --text-1: var(--navy);
    --text-2: #2a4656;
    --text-3: #687a83;
    --shadow: rgb(6 40 58 / 0.10);
  }
  body.dark {
    --bg-page: #021219;
    --bg-app: #031923;
    --card: #0a3047;
    --line: #144660;
    --input: #0b3449;
    --input-line: #22587a;
    --soft: #11405a;
    --primary: var(--gold-1);
    --accent: var(--gold-2);
    --text-1: #fdeee0;
    --text-2: #e4d5c3;
    --text-3: #9fb6c2;
    --shadow: rgb(0 0 0 / 0.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg-page); font-family: 'Montserrat', system-ui, sans-serif; color: var(--text-1); }
  button, input, select, textarea { font-family: inherit; font-size: 15px; color: inherit; }
  .serif { font-family: 'Playfair Display', Georgia, serif; }

  .app {
    width: 100%; max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg-app);
    position: relative; overflow: clip; box-shadow: 0 0 40px var(--shadow);
  }

  /* ---------- Cabeçalho ---------- */
  header.top {
    position: sticky; top: 0; z-index: 20; color: var(--cream);
    background: radial-gradient(120% 160% at 50% -60%, rgb(201 162 79 / .30), transparent 60%), var(--navy);
    padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  header.top .logo { width: 38px; height: 38px; flex: 0 0 auto; }
  .h-text { flex: 1; min-width: 0; }
  .h-kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-1); opacity: .85; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-title { font-family: 'Playfair Display', Georgia, serif; font-size: 21px; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--cream); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgb(243 207 143 / .35);
    background: transparent; color: var(--gold-1); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  #btnBack { display: none; }
  header.top.sub #btnBack { display: flex; }
  header.top.sub .logo { display: none; }

  /* Destaque da tela inicial */
  .hero {
    background: radial-gradient(90% 90% at 50% 10%, rgb(201 162 79 / .30), transparent 65%), var(--navy);
    color: var(--cream); text-align: center; padding: 0 20px 26px; margin-top: -1px; border-radius: 0 0 28px 28px; margin-bottom: 4px;
  }
  .hero img { width: 74px; height: 74px; filter: drop-shadow(0 6px 12px rgb(0 0 0 / .45)); }
  .hero .k { font-size: 10px; letter-spacing: .3em; text-transform: uppercase; margin-top: 6px; opacity: .9; }
  .hero h1 {
    margin: 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 38px; line-height: 1.1;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .d { font-size: 12.5px; margin-top: 6px; opacity: .85; }
  header.top.home { background: var(--navy); padding-bottom: 0; }
  header.top.home .logo { visibility: hidden; }
  header.top.home .h-text { visibility: hidden; }

  /* ---------- Conteúdo ---------- */
  main { padding: 14px 16px 110px; }
  h2.sec {
    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3);
    margin: 24px 2px 10px; display: flex; justify-content: space-between; align-items: center;
  }
  h2.sec:first-child { margin-top: 6px; }
  .link { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px 0; letter-spacing: 0; text-transform: none; }
  .muted { color: var(--text-3); }
  .empty { text-align: center; color: var(--text-3); font-size: 14px; padding: 22px 14px; border: 1.5px dashed var(--line); border-radius: 16px; line-height: 1.5; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .card.tap { cursor: pointer; }
  .card.tap:active { transform: scale(.99); }

  /* Linha de lista (postagens, eventos) */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:active { background: var(--soft); }
  .r-date { flex: 0 0 40px; text-align: center; line-height: 1.05; }
  .r-date b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 21px; color: var(--primary); }
  .r-date span { font-size: 10.5px; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
  .r-main { flex: 1; min-width: 0; }
  .r-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .r-sub { font-size: 12.5px; color: var(--text-3); margin-top: 2px; overflow-wrap: anywhere; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: 1px; }
  .chev { color: var(--text-3); font-size: 20px; flex: 0 0 auto; }

  .pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto; }
  .st-Ideia, .st-Planejando, .st-Pendente { background: #e6eef2; color: #3c7392; }
  .st-Produção, .st-Em-andamento { background: #f8e7c4; color: #8a6514; }
  .st-Agendado, .st-Confirmado { background: #d5e3ec; color: #1c5170; }
  .st-Publicado, .st-Realizado, .st-Pronto { background: #dcefe4; color: #2f7d5b; }
  .st-Cancelado { background: #f5ddd6; color: #b4432f; }
  body.dark .st-Ideia, body.dark .st-Planejando, body.dark .st-Pendente { background: #163f57; color: #9cc6dc; }
  body.dark .st-Produção, body.dark .st-Em-andamento { background: #4a3a14; color: #f3cf8f; }
  body.dark .st-Agendado, body.dark .st-Confirmado { background: #1c5170; color: #fdeee0; }
  body.dark .st-Publicado, body.dark .st-Realizado, body.dark .st-Pronto { background: #1d4a37; color: #9fe0bd; }
  body.dark .st-Cancelado { background: #4d2219; color: #f0a593; }

  .bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold-grad); border-radius: 99px; }

  /* Evento em destaque */
  .next { border-top: 5px solid var(--c); }
  .next .when { font-size: 12.5px; color: var(--text-3); font-weight: 500; }
  .next .name { font-family: 'Playfair Display', Georgia, serif; font-size: 25px; font-weight: 700; line-height: 1.15; margin: 4px 0 2px; overflow-wrap: anywhere; }
  .next .count { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--accent); }
  .mini-areas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .mini-areas div { background: var(--soft); border-radius: 12px; padding: 8px; text-align: center; }
  .mini-areas b { display: block; font-family: 'Playfair Display', Georgia, serif; font-size: 19px; color: var(--accent); }
  .mini-areas span { font-size: 11px; color: var(--text-2); font-weight: 600; }
  .ev-bar { width: 5px; align-self: stretch; border-radius: 4px; background: var(--c); flex: 0 0 auto; }

  /* Pasta do evento */
  .ev-head { border-left: 6px solid var(--c); }
  .ev-head .name { font-family: 'Playfair Display', Georgia, serif; font-size: 26px; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .ev-head .tema { font-family: 'Playfair Display', Georgia, serif; font-style: italic; color: var(--accent); font-size: 16px; margin-top: 2px; }
  .ev-head .meta { font-size: 13px; color: var(--text-2); margin-top: 8px; line-height: 1.7; }
  .ev-head .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .pct { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12.5px; font-weight: 600; color: var(--text-2); }
  .pct .bar { flex: 1; }

  .area { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .area .ic { width: 46px; height: 46px; border-radius: 14px; background: var(--navy); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 auto; }
  body.dark .area .ic { background: #031923; }
  .area .t { font-weight: 700; font-size: 16.5px; }
  .area .r { font-size: 13px; color: var(--text-2); margin: 2px 0 7px; }
  .area .n { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 18px; color: var(--accent); flex: 0 0 auto; }
  .area .falta { font-size: 12px; color: var(--danger); margin-top: 7px; }
  .area .feito { font-size: 12px; color: var(--ok); margin-top: 7px; font-weight: 600; }

  /* Campos dentro das áreas */
  .field { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
  .f-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); font-weight: 700; }
  .f-val { font-size: 16px; font-weight: 600; margin-top: 3px; overflow-wrap: anywhere; }
  .f-val.tema { font-family: 'Playfair Display', Georgia, serif; font-style: italic; color: var(--accent); font-size: 19px; }
  .f-val.txt { font-size: 14px; font-weight: 400; white-space: pre-wrap; color: var(--text-2); }
  .vazio { color: var(--danger); font-weight: 500; font-style: italic; font-size: 14px; }
  .edit { font-size: 13px; color: var(--primary); font-weight: 600; flex: 0 0 auto; }

  .check { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: none; }
  .check input { width: 22px; height: 22px; accent-color: var(--blue); flex: 0 0 auto; }
  .check .r-main { cursor: pointer; }
  .check.done .r-title { text-decoration: line-through; color: var(--text-3); }

  .person { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .ok { color: var(--ok); font-weight: 600; }
  .no { color: var(--danger); font-weight: 600; }
  .note { font-size: 13.5px; color: var(--text-2); margin-top: 10px; white-space: pre-wrap; background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .wa { font-size: 12px; font-weight: 700; color: #fff; background: #2f9e62; padding: 7px 11px; border-radius: 99px; text-decoration: none; flex: 0 0 auto; }

  .timeline .row { cursor: pointer; }
  .hora { flex: 0 0 auto; background: var(--navy); color: var(--gold-1); font-size: 13px; font-weight: 700; padding: 5px 9px; border-radius: 9px; min-width: 56px; text-align: center; }
  body.dark .hora { background: var(--gold-1); color: var(--navy); }

  .add-btn { width: 100%; border: 1.5px dashed var(--input-line); background: transparent; color: var(--primary); font-weight: 600; border-radius: 14px; padding: 12px; cursor: pointer; margin-bottom: 10px; }

  /* Filtros */
  .seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: none; background: none; padding: 9px 4px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-3); cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text-1); box-shadow: 0 1px 3px var(--shadow); }

  /* Calendário */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; text-transform: capitalize; }
  .cal-nav { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; color: var(--text-2); }
  .cal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: 11px; text-align: center; color: var(--text-3); font-weight: 700; padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px; font-weight: 500; color: var(--text-1); position: relative; border: 2px solid transparent;
  }
  .cal-day.out { opacity: .3; }
  .cal-day.today { color: var(--accent); font-weight: 800; }
  .cal-day.has-ev { background: var(--c); color: #fff; font-weight: 700; }
  .cal-day.sel { border-color: var(--gold-2); }
  .cal-day .dots { display: flex; gap: 2px; position: absolute; bottom: 5px; }
  .cal-day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--blue-light); }
  .cal-day.has-ev .dots i { background: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-3); margin: 10px 4px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* Navegação inferior */
  nav.tabs {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; z-index: 30;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--card); border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--text-3); cursor: pointer; padding: 5px 0; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--text-1); }
  .tab.on svg { color: var(--accent); }

  .fab {
    position: fixed; z-index: 25; bottom: calc(78px + env(safe-area-inset-bottom)); right: max(16px, calc(50% - 240px + 16px));
    border: none; border-radius: 999px; padding: 14px 20px; display: none; align-items: center; gap: 8px;
    background: var(--navy); color: var(--gold-1); font-weight: 700; font-size: 14.5px; cursor: pointer;
    box-shadow: 0 10px 24px -8px rgb(6 40 58 / .6);
  }
  .fab.show { display: flex; }
  .fab b { font-size: 22px; line-height: 1; font-weight: 500; }
  body.dark .fab { background: var(--gold-grad); color: var(--navy); }

  /* Folha (formulários) */
  .overlay { position: fixed; inset: 0; background: rgb(3 25 35 / .55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  .sheet { background: var(--bg-app); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 6px; font-family: 'Playfair Display', Georgia, serif; font-size: 23px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .close-x { background: var(--soft); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--text-2); flex: 0 0 auto; }
  label.f { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin: 14px 0 6px; }
  .in { width: 100%; padding: 12px; border: 1px solid var(--input-line); border-radius: 12px; background: var(--input); outline: none; font-size: 16px; }
  .in:focus { border-color: var(--blue); }
  textarea.in { min-height: 84px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .time-pick { display: flex; align-items: center; gap: 4px; }
  .time-pick select { flex: 1; min-width: 0; padding: 12px 4px; text-align: center; }
  .time-pick span { font-weight: 700; color: var(--text-3); }
  label.chk { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 15px; }
  label.chk input { width: 22px; height: 22px; accent-color: var(--blue); }
  details.more { margin-top: 14px; }
  details.more summary { cursor: pointer; color: var(--primary); font-weight: 600; font-size: 14px; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw.on { border-color: var(--bg-app); box-shadow: 0 0 0 2px var(--gold-2); }
  .btns { display: flex; gap: 8px; margin-top: 20px; }
  .btn { flex: 1; padding: 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: var(--gold-1); }
  body.dark .btn.primary { background: var(--gold-grad); color: var(--navy); border: none; }
  .btn.danger { color: var(--danger); flex: 0 0 auto; }
  .btn.small { padding: 9px 12px; font-size: 13px; flex: 0 0 auto; }
  .btn.wide { width: 100%; }

  .toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--navy); color: var(--gold-1); padding: 10px 18px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <header class="top home" id="hdr">
    <button class="icon-btn" id="btnBack" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img class="logo" src="logo-30anos.png" alt="">
    <div class="h-text">
      <div class="h-kicker" id="hdrKicker"></div>
      <div class="h-title" id="hdrTitle"></div>
    </div>
    <button class="icon-btn" id="btnMenu" aria-label="Opções e backup">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>

  <div id="heroSlot"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab"><b>+</b><span id="fabLabel"></span></button>

<nav class="tabs">
  <button class="tab on" data-tab="eventos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Eventos
  </button>
  <button class="tab" data-tab="calendario">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário
  </button>
  <button class="tab" data-tab="posts">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Postagens
  </button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const STORE_KEY = 'mkt-estrategia-v1';
const DARK_KEY = 'mkt-dark';

const REDES = {
  Instagram: '#c9467a', Facebook: '#3b5fa8', TikTok: '#2b2b2b', WhatsApp: '#2f9e62',
  YouTube: '#c8322b', LinkedIn: '#1c6fa0', 'E-mail': '#c9a24f', Outro: '#8c8a85',
};
const FORMATOS = ['Feed', 'Carrossel', 'Reels', 'Stories', 'Vídeo', 'Live', 'Texto', 'Outro'];
const STATUS_POST = ['Ideia', 'Produção', 'Agendado', 'Publicado'];
const STATUS_EV = ['Planejando', 'Confirmado', 'Realizado', 'Cancelado'];
const STATUS_FRENTE = ['Pendente', 'Em andamento', 'Pronto'];
const CORES_EV = ['#1c5170', '#a07a20', '#4483a3', '#7a3b5c', '#2f7d5b', '#06283a', '#b4432f', '#5b4a8a'];
const COBERTURA_PADRAO = ['Fotos', 'Vídeos', 'Stories ao vivo', 'Depoimentos'];
const ESTRUTURA_PADRAO = ['Painel de LED e iluminação', 'Som', 'Limpeza e lanchonete', 'Cozinha', 'Montagem (arrumar antes do evento)'];
const MODELO_POSTS = [
  [-14, 'Teaser: algo vem aí', 'Instagram', 'Stories'],
  [-10, 'Anúncio oficial do evento', 'Instagram', 'Carrossel'],
  [-7, 'Programação do evento', 'Instagram', 'Reels'],
  [-7, 'Convite no grupo/lista', 'WhatsApp', 'Texto'],
  [-3, 'Contagem regressiva: faltam 3 dias', 'Instagram', 'Stories'],
  [-1, 'É amanhã! Últimas informações', 'Instagram', 'Feed'],
  [0, 'Ao vivo do evento', 'Instagram', 'Stories'],
  [1, 'Obrigado a todos que vieram!', 'Instagram', 'Carrossel'],
  [3, 'Vídeo resumo do evento', 'Instagram', 'Reels'],
];
const AREAS = {
  marketing: { nome: 'Marketing', ic: '📣' },
  org: { nome: 'Organização geral', ic: '⛪' },
  estrutura: { nome: 'Estrutura do evento', ic: '🏗️' },
};

// ---------- Helpers ----------
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOW_LONGO = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const fmtLong = s => { const d = parse(s); return `${DOW_LONGO[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const diffDays = s => Math.round((parse(s) - parse(today())) / 86400000);
const relLabel = s => { const n = diffDays(s); return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n === -1 ? 'ontem' : n > 0 ? `em ${n} dias` : `há ${-n} dias`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const opts = (arr, sel) => arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
const byDate = (a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''));
const money = v => v ? Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const stCls = s => 'st-' + String(s).replace(/\s+/g, '-');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- Dados ----------
function ensureAreas(e) {
  e.marketing ||= { responsavel: '', coberturaNotas: '', cobertura: COBERTURA_PADRAO.map(texto => ({ id: uid(), texto, responsavel: '', feito: false })) };
  e.org ||= { responsavel: '', tema: '', pregadores: [], cronograma: [], musica: {} };
  e.org.musica ||= {};
  e.estrutura ||= ESTRUTURA_PADRAO.map(nome => ({ id: uid(), nome, responsavel: '', contato: '', horario: '', status: 'Pendente', notas: '' }));
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.posts) && Array.isArray(s.eventos)) { s.eventos.forEach(ensureAreas); return s; }
  } catch (e) {}
  return { posts: [], eventos: [] };
}
let store = load();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast('Não foi possível salvar'); }
}
const evById = id => store.eventos.find(e => e.id === id);
function evColor(e) {
  if (e && e.cor) return e.cor;
  const i = e ? [...e.id].reduce((a, c) => a + c.charCodeAt(0), 0) : 0;
  return CORES_EV[i % CORES_EV.length];
}
const postsDo = e => store.posts.filter(p => p.eventoId === e.id).sort(byDate);
function pessoas() {
  const n = new Set();
  store.eventos.forEach(e => {
    [e.marketing.responsavel, e.org.responsavel, e.org.musica.responsavel].forEach(x => x && n.add(x));
    e.marketing.cobertura.forEach(c => c.responsavel && n.add(c.responsavel));
    e.org.cronograma.forEach(c => c.responsavel && n.add(c.responsavel));
    e.estrutura.forEach(f => f.responsavel && n.add(f.responsavel));
    (e.equipe || []).forEach(m => m.nome && n.add(m.nome));
  });
  store.posts.forEach(p => p.responsavel && n.add(p.responsavel));
  return [...n].sort();
}

// O que falta em cada área
function areaCheck(e) {
  const posts = postsDo(e), m = e.marketing, o = e.org, mu = o.musica;
  return {
    marketing: [
      ['Responsável do marketing', !!m.responsavel],
      ['Postagens planejadas', posts.length > 0],
      ['Postagens agendadas', posts.length > 0 && posts.every(p => p.status === 'Agendado' || p.status === 'Publicado')],
      ['Cobertura do dia com responsáveis', m.cobertura.length > 0 && m.cobertura.every(c => c.responsavel)],
    ],
    org: [
      ['Responsável geral', !!o.responsavel],
      ['Tema', !!o.tema],
      ['Pregadores', o.pregadores.length > 0],
      ['Pregadores confirmados', o.pregadores.length > 0 && o.pregadores.every(p => p.confirmado)],
      ['Ministério de música', !!(mu.nome || mu.responsavel)],
      ['Música confirmada', !!mu.confirmado],
      ['Cronograma', o.cronograma.length > 0],
    ],
    estrutura: e.estrutura.map(f => [f.nome, f.status === 'Pronto']),
  };
}
function evPct(e) {
  const all = Object.values(areaCheck(e)).flat();
  return all.length ? Math.round(all.filter(x => x[1]).length / all.length * 100) : 0;
}

// ---------- Navegação ----------
let tab = 'eventos';
let openEvId = null, openArea = null;
let showPast = false;
let postFilter = 'Próximas';
let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calSel = today();
let calMode = 'Mês';
let calFilter = 'Tudo';
let ACTS = {}, actSeq = 0;
const act = fn => { const k = 'a' + (++actSeq); ACTS[k] = fn; return `data-act="${k}"`; };

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; openEvId = null; openArea = null;
  render(); window.scrollTo(0, 0);
});
document.getElementById('btnBack').onclick = () => {
  if (openArea) openArea = null; else openEvId = null;
  render(); window.scrollTo(0, 0);
};
function openFolder(id, area = null) {
  closeSheet();
  tab = 'eventos'; openEvId = id; openArea = area;
  render(); window.scrollTo(0, 0);
}

function render() {
  ACTS = {};
  if (openEvId && !evById(openEvId)) { openEvId = null; openArea = null; }
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
  const ev = openEvId && evById(openEvId);
  const hdr = document.getElementById('hdr');
  const home = tab === 'eventos' && !ev;
  hdr.classList.toggle('home', home);
  hdr.classList.toggle('sub', !!ev);
  const K = document.getElementById('hdrKicker'), T = document.getElementById('hdrTitle');
  if (ev && openArea) { K.textContent = ev.nome; T.textContent = AREAS[openArea].nome; }
  else if (ev) { K.textContent = 'Pasta do evento'; T.textContent = ev.nome; }
  else { K.textContent = 'Alcançados pela Misericórdia'; T.textContent = { eventos: 'Eventos', calendario: 'Calendário', posts: 'Postagens' }[tab]; }

  const d = new Date();
  document.getElementById('heroSlot').innerHTML = home ? `<div class="hero">
    <img src="logo-30anos.png" alt="30 anos — Alcançados pela Misericórdia">
    <div class="k">Alcançados pela</div><h1>Misericórdia</h1>
    <div class="d">${DOW_LONGO[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}</div></div>` : '';

  const v = document.getElementById('view');
  v.innerHTML = ev ? (openArea ? viewArea(ev) : viewPasta(ev))
    : ({ eventos: viewEventos, calendario: viewCalendario, posts: viewPosts })[tab]();
  bind(v);

  // Botão principal de cada tela
  const fab = document.getElementById('fab');
  let label = '', fn = null;
  if (ev && openArea === 'marketing') { label = 'Postagem'; fn = () => novaPostagem(ev); }
  else if (ev && openArea === 'estrutura') { label = 'Frente'; fn = () => frenteForm(ev); }
  else if (!ev && tab === 'eventos') { label = 'Novo evento'; fn = () => openEventForm(); }
  else if (tab === 'calendario') { label = 'Postagem'; fn = () => openPostForm({ data: calSel }); }
  else if (tab === 'posts') { label = 'Nova postagem'; fn = () => openPostForm(); }
  fab.classList.toggle('show', !!fn);
  document.getElementById('fabLabel').textContent = label;
  fab.onclick = fn;
}

function bind(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    if (el.type === 'checkbox') el.onchange = () => ACTS[el.dataset.act](el.checked);
    else el.onclick = ev => { ev.stopPropagation(); ACTS[el.dataset.act](); };
  });
}

// ---------- Componentes ----------
function postRow(p, showEv = true) {
  const d = parse(p.data);
  const ev = showEv && p.eventoId && evById(p.eventoId);
  const late = p.data < today() && p.status !== 'Publicado';
  return `<div class="row" ${act(() => openPostForm(p))}>
    <div class="r-date"><b>${d.getDate()}</b><span>${MES_CURTO[d.getMonth()]}</span></div>
    <div class="r-main">
      <div class="r-title">${esc(p.titulo)}</div>
      <div class="r-sub"><span class="dot" style="background:${REDES[p.rede] || REDES.Outro}"></span>${esc(p.rede)} · ${esc(p.formato)}${p.hora ? ' · ' + esc(p.hora) : ''}</div>
      ${ev ? `<div class="r-sub">${esc(ev.nome)}</div>` : ''}
      ${late ? `<div class="r-sub no">Atrasada</div>` : ''}
    </div>
    <span class="pill ${stCls(p.status)}">${esc(p.status)}</span>
  </div>`;
}
function evRow(e) {
  const d = parse(e.data);
  const pct = evPct(e);
  return `<div class="row" style="--c:${evColor(e)}" ${act(() => openFolder(e.id))}>
    <div class="ev-bar"></div>
    <div class="r-date"><b>${d.getDate()}</b><span>${MES_CURTO[d.getMonth()]}</span></div>
    <div class="r-main">
      <div class="r-title">${esc(e.nome)}</div>
      <div class="r-sub">${relLabel(e.data)} · ${pct}% organizado</div>
      <div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div>
    </div>
    <span class="chev">›</span>
  </div>`;
}
const pessoa = n => n ? esc(n) : '<span class="vazio">definir responsável</span>';
function waLink(contato) {
  const tel = (contato || '').replace(/\D/g, '');
  if (tel.length < 10) return '';
  return `<a class="wa" href="https://wa.me/${tel.length <= 11 ? '55' + tel : tel}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>`;
}
function seg(list, cur, fn) {
  return `<div class="seg">${list.map(x => `<button class="${x === cur ? 'on' : ''}" ${act(() => fn(x))}>${x}</button>`).join('')}</div>`;
}

// ---------- Tela: Eventos ----------
function viewEventos() {
  const t = today();
  const futuros = store.eventos.filter(e => e.data >= t && e.status !== 'Cancelado').sort(byDate);
  const passados = store.eventos.filter(e => e.data < t || e.status === 'Cancelado').sort(byDate).reverse();
  let h = '';
  const prox = futuros[0];
  if (prox) {
    const chk = areaCheck(prox);
    const n = diffDays(prox.data);
    h += `<h2 class="sec">Próximo evento</h2>
    <div class="card tap next" style="--c:${evColor(prox)}" ${act(() => openFolder(prox.id))}>
      <div class="when">${fmtLong(prox.data)}${prox.hora ? ' · ' + esc(prox.hora) : ''}</div>
      <div class="name">${esc(prox.nome)}</div>
      ${prox.org.tema ? `<div class="when serif" style="font-style:italic;color:var(--accent);font-size:15px">${esc(prox.org.tema)}</div>` : ''}
      <div class="count">${n === 0 ? 'É hoje!' : n === 1 ? 'É amanhã!' : `Faltam ${n} dias`}</div>
      <div class="pct"><div class="bar"><i style="width:${evPct(prox)}%"></i></div>${evPct(prox)}% organizado</div>
      <div class="mini-areas">${Object.entries(AREAS).map(([k, a]) => {
        const l = chk[k]; return `<div><b>${l.filter(x => x[1]).length}/${l.length}</b><span>${a.nome.split(' ')[0]}</span></div>`;
      }).join('')}</div>
    </div>`;
  }
  const outros = futuros.slice(1);
  h += `<h2 class="sec">${prox ? 'Outros eventos' : 'Eventos'}</h2>`;
  h += outros.length ? `<div class="list">${outros.map(evRow).join('')}</div>`
    : `<div class="empty">${prox ? 'Nenhum outro evento planejado.' : 'Nenhum evento ainda.<br>Toque em <b>+ Novo evento</b> para criar a primeira pasta.'}</div>`;

  const proxPosts = store.posts.filter(p => p.data >= t && p.status !== 'Publicado').sort(byDate).slice(0, 3);
  if (proxPosts.length) {
    h += `<h2 class="sec">Próximas postagens <button class="link" ${act(() => { tab = 'posts'; render(); window.scrollTo(0, 0); })}>ver todas</button></h2>
      <div class="list">${proxPosts.map(p => postRow(p)).join('')}</div>`;
  }
  if (passados.length) {
    h += `<h2 class="sec">Eventos passados <button class="link" ${act(() => { showPast = !showPast; render(); })}>${showPast ? 'ocultar' : `mostrar (${passados.length})`}</button></h2>`;
    if (showPast) h += `<div class="list">${passados.map(evRow).join('')}</div>`;
  }
  return h;
}

// ---------- Tela: Pasta do evento ----------
function viewPasta(e) {
  const chk = areaCheck(e);
  const pct = evPct(e);
  let h = `<div class="card ev-head" style="--c:${evColor(e)}">
    <div class="top"><div>
      <div class="name">${esc(e.nome)}</div>
      ${e.org.tema ? `<div class="tema">${esc(e.org.tema)}</div>` : ''}
    </div><button class="btn small" ${act(() => openEventForm(e))}>Editar</button></div>
    <div class="meta">📅 ${fmtLong(e.data)}${e.hora ? ' · ' + esc(e.hora) : ''} <span class="muted">(${relLabel(e.data)})</span>
      ${e.local ? `<br>📍 ${esc(e.local)}` : ''}</div>
    <div class="pct"><div class="bar"><i style="width:${pct}%"></i></div>${pct}% organizado</div>
  </div>
  <h2 class="sec">Organização do evento</h2>`;

  for (const [k, a] of Object.entries(AREAS)) {
    const l = chk[k], ok = l.filter(x => x[1]).length, falta = l.filter(x => !x[1]).map(x => x[0]);
    let resp;
    if (k === 'marketing') resp = `Responsável: ${pessoa(e.marketing.responsavel)}`;
    else if (k === 'org') resp = `Responsável: ${pessoa(e.org.responsavel)}`;
    else resp = `${e.estrutura.filter(f => f.status === 'Pronto').length} de ${e.estrutura.length} frentes prontas`;
    h += `<div class="card tap area" ${act(() => { openArea = k; render(); window.scrollTo(0, 0); })}>
      <div class="ic">${a.ic}</div>
      <div class="r-main">
        <div class="t">${a.nome}</div>
        <div class="r">${resp}</div>
        <div class="bar"><i style="width:${l.length ? ok / l.length * 100 : 0}%"></i></div>
        ${falta.length ? `<div class="falta">Falta: ${esc(falta.slice(0, 3).join(', '))}${falta.length > 3 ? ` e mais ${falta.length - 3}` : ''}</div>` : '<div class="feito">✓ Tudo certo</div>'}
      </div>
      <div class="n">${ok}/${l.length}</div>
    </div>`;
  }

  if (e.objetivo || e.publico || e.orcamento || e.notas) {
    h += `<h2 class="sec">Informações</h2><div class="card" style="font-size:14px;line-height:1.7;color:var(--text-2)">
      ${e.objetivo ? `<b>Objetivo:</b> ${esc(e.objetivo)}<br>` : ''}
      ${e.publico ? `<b>Público:</b> ${esc(e.publico)}<br>` : ''}
      ${e.orcamento ? `<b>Orçamento:</b> ${money(e.orcamento)}<br>` : ''}
      ${e.notas ? `<div style="white-space:pre-wrap">${esc(e.notas)}</div>` : ''}</div>`;
  }
  return h;
}

// ---------- Tela: Áreas ----------
function fieldCard(label, valueHtml, onClick, cls = '') {
  return `<div class="card tap field" ${act(onClick)}>
    <div style="min-width:0"><div class="f-label">${label}</div><div class="f-val ${cls}">${valueHtml}</div></div><span class="edit">Editar</span></div>`;
}
function novaPostagem(e) {
  const t = today();
  openPostForm({ eventoId: e.id, data: e.data > t ? addDays(e.data, -7) : t, responsavel: e.marketing.responsavel });
}
function frenteForm(e, f = {}) {
  openForm({
    title: f.id ? f.nome : 'Nova frente', vals: { status: 'Pendente', ...f },
    fields: [{ k: 'nome', label: 'Frente', req: true, ph: 'Ex.: Decoração, Estacionamento' }, { k: 'responsavel', label: 'Responsável', type: 'person' },
      { k: 'contato', label: 'Contato / fornecedor (WhatsApp)', type: 'tel' }, { k: 'horario', label: 'Quando (montagem / chegada)', ph: 'Ex.: Sábado às 14h' },
      { k: 'status', label: 'Status', type: 'select', options: STATUS_FRENTE }, { k: 'notas', label: 'O que precisa, valores, observações', type: 'textarea' }],
    onSave: v => f.id ? Object.assign(f, v) : e.estrutura.push({ id: uid(), ...v }),
    onDelete: f.id ? () => { e.estrutura = e.estrutura.filter(x => x !== f); } : null,
  });
}

function viewArea(e) {
  let h = '';
  if (openArea === 'marketing') {
    const m = e.marketing;
    const posts = postsDo(e);
    const cobForm = (c = {}) => openForm({
      title: c.id ? 'Item da cobertura' : 'Novo item da cobertura', vals: c,
      fields: [{ k: 'texto', label: 'O que cobrir', req: true, ph: 'Ex.: Transmissão ao vivo' }, { k: 'responsavel', label: 'Responsável', type: 'person' }],
      onSave: v => c.id ? Object.assign(c, v) : m.cobertura.push({ id: uid(), ...v, feito: false }),
      onDelete: c.id ? () => { m.cobertura = m.cobertura.filter(x => x !== c); } : null,
    });
    h += `<h2 class="sec">Responsável</h2>`;
    h += fieldCard('Marketing', pessoa(m.responsavel), () => openForm({ title: 'Responsável do marketing', vals: m, fields: [{ k: 'responsavel', label: 'Nome', type: 'person' }], onSave: v => Object.assign(m, v) }));

    h += `<h2 class="sec">Postagens · ${posts.length}</h2>`;
    h += posts.length ? `<div class="list">${posts.map(p => postRow(p, false)).join('')}</div>`
      : `<div class="empty" style="margin-bottom:10px">Nenhuma postagem ainda.</div>`;
    h += `<button class="add-btn" ${act(() => { const n = gerarPosts(e.id); save(); render(); toast(n ? `${n} postagens criadas` : 'O cronograma já foi gerado'); })}>Gerar cronograma de divulgação automático</button>`;

    h += `<h2 class="sec">Cobertura no dia do evento</h2>
      <div class="list">${m.cobertura.map(c => `<div class="check ${c.feito ? 'done' : ''}">
        <input type="checkbox" ${c.feito ? 'checked' : ''} ${act(v => { c.feito = v; save(); render(); })} aria-label="Concluído">
        <div class="r-main" ${act(() => cobForm(c))}><div class="r-title">${esc(c.texto)}</div><div class="r-sub">${pessoa(c.responsavel)}</div></div>
        <span class="chev">›</span></div>`).join('')}</div>
      <button class="add-btn" ${act(() => cobForm())}>+ Adicionar item da cobertura</button>`;
    h += fieldCard('Observações da cobertura', m.coberturaNotas ? esc(m.coberturaNotas) : '<span class="vazio">nenhuma observação</span>',
      () => openForm({ title: 'Observações da cobertura', vals: m, fields: [{ k: 'coberturaNotas', label: 'Equipamentos, horários, onde ficar', type: 'textarea' }], onSave: v => Object.assign(m, v) }), 'txt');
  }

  if (openArea === 'org') {
    const o = e.org, mu = o.musica;
    const pregForm = (p = {}) => openForm({
      title: p.id ? 'Pregador' : 'Novo pregador', vals: p,
      fields: [{ k: 'nome', label: 'Nome', req: true }, { k: 'tema', label: 'Tema da pregação' }, { k: 'horario', label: 'Horário', type: 'time' },
        { k: 'contato', label: 'Contato (WhatsApp)', type: 'tel' }, { k: 'confirmado', label: 'Presença confirmada', type: 'check' }],
      onSave: v => p.id ? Object.assign(p, v) : o.pregadores.push({ id: uid(), ...v }),
      onDelete: p.id ? () => { o.pregadores = o.pregadores.filter(x => x !== p); } : null,
    });
    const cronForm = (c = {}) => openForm({
      title: c.id ? 'Momento do cronograma' : 'Novo momento', vals: c,
      fields: [{ k: 'hora', label: 'Horário', type: 'time', req: true }, { k: 'atividade', label: 'Atividade', req: true, ph: 'Ex.: Acolhida, Louvor, Pregação, Missa' }, { k: 'responsavel', label: 'Responsável', type: 'person' }],

// ---------- Tela: Calendário ----------
function itensDoDia(s) {
  const out = [];
  if (calFilter !== 'Postagens') store.eventos.filter(e => e.data === s).forEach(e => out.push({ ev: e }));
  if (calFilter !== 'Eventos') store.posts.filter(p => p.data === s).sort(byDate).forEach(p => out.push({ p }));
  return out;
}
function viewCalendario() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const t = today();
  let h = `<div class="cal-head">
      <button class="cal-nav" ${act(() => { calMonth = new Date(y, m - 1, 1); render(); })} aria-label="Mês anterior">‹</button>
      <b>${MESES[m]} ${y}</b>
      <button class="cal-nav" ${act(() => { calMonth = new Date(y, m + 1, 1); render(); })} aria-label="Próximo mês">›</button></div>
    ${seg(['Mês', 'Lista'], calMode, x => { calMode = x; render(); })}
    ${seg(['Tudo', 'Eventos', 'Postagens'], calFilter, x => { calFilter = x; render(); })}`;

  if (calMode === 'Mês') {
    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    let cells = DOW.map(d => `<div class="cal-dow">${d[0]}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const s = iso(d);
      const its = itensDoDia(s);
      const ev = its.find(x => x.ev);
      const nPosts = its.filter(x => x.p).length;
      cells += `<div class="cal-day ${d.getMonth() !== m ? 'out' : ''} ${s === t ? 'today' : ''} ${s === calSel ? 'sel' : ''} ${ev ? 'has-ev' : ''}"
        ${ev ? `style="--c:${evColor(ev.ev)}"` : ''} ${act(() => { calSel = s; render(); })}>${d.getDate()}
        ${nPosts ? `<div class="dots">${'<i></i>'.repeat(Math.min(nPosts, 3))}</div>` : ''}</div>`;
    }
    h += `<div class="cal"><div class="cal-grid">${cells}</div>
      <div class="legend"><span><i style="background:var(--gold-3)"></i>Dia de evento (na cor do evento)</span><span><i style="background:var(--blue-light);border-radius:50%"></i>Postagem</span></div></div>`;
    const its = itensDoDia(calSel);
    h += `<h2 class="sec">${fmtLong(calSel)}</h2>`;
    h += its.length ? `<div class="list">${its.map(x => x.ev ? evRow(x.ev) : postRow(x.p)).join('')}</div>`
      : `<div class="empty">Nada neste dia.</div>`;
  } else {
    const last = new Date(y, m + 1, 0).getDate();
    let any = false;
    for (let dd = 1; dd <= last; dd++) {
      const s = iso(new Date(y, m, dd));
      const its = itensDoDia(s);
      if (!its.length) continue;
      any = true;
      h += `<h2 class="sec" ${s === t ? 'style="color:var(--accent)"' : ''}>${fmtLong(s)}${s === t ? ' · hoje' : ''}</h2>
        <div class="list">${its.map(x => x.ev ? evRow(x.ev) : postRow(x.p)).join('')}</div>`;
    }
    if (!any) h += `<div class="empty">Nada planejado neste mês.</div>`;
  }
  return h;
}

// ---------- Tela: Postagens ----------
function viewPosts() {
  const t = today();
  let list = store.posts.slice().sort(byDate);
  if (postFilter === 'Próximas') list = list.filter(p => p.data >= t && p.status !== 'Publicado');
  else if (postFilter === 'Atrasadas') list = list.filter(p => p.data < t && p.status !== 'Publicado');
  else if (postFilter === 'Publicadas') list = list.filter(p => p.status === 'Publicado').reverse();
  let h = seg(['Próximas', 'Atrasadas', 'Publicadas', 'Todas'], postFilter, x => { postFilter = x; render(); });
  if (!list.length) return h + `<div class="empty">Nenhuma postagem aqui.</div>`;
  let last = '';
  let group = [];
  const flush = () => { if (group.length) h += `<h2 class="sec">${last}</h2><div class="list">${group.join('')}</div>`; group = []; };
  list.forEach(p => {
    const d = parse(p.data), mk = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if (mk !== last) { flush(); last = mk; }
    group.push(postRow(p));
  });
  flush();
  return h;
}

// Seletor de horário (hora + minuto)
function timePick(id, value) {
  const [vh, vm] = (value || '').split(':');
  const mins = [...new Set(['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55', ...(vm ? [vm] : [])])].sort();
  const hs = Array.from({ length: 24 }, (_, i) => pad(i));
  return `<div class="time-pick" id="${id}">
    <select class="in" data-part="h" aria-label="Hora"><option value="">--</option>${hs.map(x => `<option ${x === vh ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <span>:</span>
    <select class="in" data-part="m" aria-label="Minutos">${mins.map(x => `<option ${x === (vm || '00') ? 'selected' : ''}>${x}</option>`).join('')}</select>
  </div>`;
}
function readTime(id) {
  const box = document.getElementById(id);
  const h = box.querySelector('[data-part=h]').value;
  return h ? `${h}:${box.querySelector('[data-part=m]').value}` : '';
}

function openForm({ title, fields, vals = {}, onSave, onDelete }) {
  const ctl = f => {
    const v = vals[f.k] ?? '';
    const ph = f.ph ? `placeholder="${esc(f.ph)}"` : '';
    if (f.type === 'textarea') return `<textarea class="in" id="ff_${f.k}" ${ph}>${esc(v)}</textarea>`;
    if (f.type === 'select') return `<select class="in" id="ff_${f.k}">${opts(f.options, v || f.options[0])}</select>`;
    if (f.type === 'time') return timePick(`ff_${f.k}`, v);
    if (f.type === 'check') return `<label class="chk"><input type="checkbox" id="ff_${f.k}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
    const type = f.type === 'person' ? 'text' : (f.type || 'text');
    return `<input class="in" id="ff_${f.k}" type="${type}" ${f.type === 'person' ? 'list="ffPeople" autocomplete="off"' : ''} ${ph} value="${esc(v)}">`;
  };
  openSheet(`<h3>${esc(title)} <button class="close-x" aria-label="Fechar">✕</button></h3>
    ${fields.map(f => f.type === 'check' ? ctl(f) : `<label class="f">${esc(f.label)}${f.req ? ' *' : ''}</label>${ctl(f)}`).join('')}
    <datalist id="ffPeople">${pessoas().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="btns">${onDelete ? '<button class="btn danger" id="ffDel">Excluir</button>' : ''}<button class="btn primary" id="ffSave">Salvar</button></div>`);
  document.getElementById('ffSave').onclick = () => {
    const out = {};
    for (const f of fields) {
      const el = document.getElementById('ff_' + f.k);
      out[f.k] = f.type === 'check' ? el.checked : f.type === 'time' ? readTime('ff_' + f.k) : el.value.trim();
      if (f.req && !out[f.k]) { toast(`Preencha: ${f.label}`); return; }
    }
    onSave(out); save(); closeSheet(); render(); toast('Salvo');
  };
  if (onDelete) document.getElementById('ffDel').onclick = () => {
    if (!confirm('Excluir este item?')) return;
    onDelete(); save(); closeSheet(); render();
  };
}

  sheet.querySelectorAll('[data-cor]').forEach(b => b.onclick = () => {
    cor = b.dataset.cor; sheet.querySelectorAll('[data-cor]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('eSave').onclick = () => {
    const nome = $('eNome').value.trim(), data = $('eData').value;
    if (!nome || !data) { toast('Preencha o nome e a data'); return; }
    const obj = {
      nome, data, hora: readTime('eHora'), cor, local: $('eLocal').value.trim(), status: $('eStatus').value,
      objetivo: $('eObjetivo').value.trim(), publico: $('ePublico').value.trim(), orcamento: $('eOrcamento').value, notas: $('eNotas').value,
    };
    let id = e.id;
    if (isNew) {
      id = uid();
      const ev = { id, ...obj };
      ensureAreas(ev);
      store.eventos.push(ev);
      if ($('ePosts').checked) gerarPosts(id);
    } else {
      const ev = evById(id);
      const delta = Math.round((parse(data) - parse(ev.data)) / 86400000);
      if (delta && store.posts.some(p => p.eventoId === id) && confirm('A data mudou. Mover também as postagens deste evento?')) {
        store.posts.forEach(p => { if (p.eventoId === id && p.status !== 'Publicado') p.data = addDays(p.data, delta); });
      }
      Object.assign(ev, obj);
    }
    save(); openFolder(id, isNew ? null : openArea); toast(isNew ? 'Evento criado' : 'Evento salvo');
  };
  if (!isNew) {
    $('eDel').onclick = () => {
      if (!confirm(`Excluir o evento "${e.nome}"? As postagens ligadas a ele serão mantidas.`)) return;
      store.eventos = store.eventos.filter(x => x.id !== e.id);
      store.posts.forEach(p => { if (p.eventoId === e.id) p.eventoId = ''; });
      openEvId = null; openArea = null;
      save(); closeSheet(); render(); toast('Evento excluído');
    };
  }
}

function gerarPosts(evId) {
  const e = evById(evId);
  let n = 0;
  MODELO_POSTS.forEach(([off, titulo, rede, formato]) => {
    const data = addDays(e.data, off);
    if (store.posts.some(p => p.eventoId === evId && p.titulo === titulo && p.data === data)) return;
    store.posts.push({ id: uid(), titulo, data, hora: '', rede, formato, status: 'Ideia', eventoId: evId, responsavel: e.marketing.responsavel || '', legenda: '', hashtags: '', notas: '' });
    n++;
  });
  return n;
}

    const linhas = store.posts.filter(p => p.data >= today()).sort(byDate)
      .map(p => `${parse(p.data).getDate()}/${pad(parse(p.data).getMonth() + 1)}${p.hora ? ' ' + p.hora : ''} · ${p.rede} ${p.formato} · ${p.titulo} [${p.status}]`);
    const txt = '📅 Cronograma de postagens\n\n' + (linhas.join('\n') || 'Nenhuma postagem futura.');
    navigator.clipboard?.writeText(txt).then(() => toast('Cronograma copiado'), () => toast('Não foi possível copiar'));
  };
};
document.getElementById('importFile').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if (!Array.isArray(d.posts) || !Array.isArray(d.eventos)) throw new Error();
    if (!confirm('Substituir os dados atuais pelos do arquivo?')) return;
    d.eventos.forEach(ensureAreas);
    store = d; save(); closeSheet(); render(); toast('Dados importados');
  }).catch(() => toast('Arquivo inválido'));
  ev.target.value = '';
};

function setDark(on) { document.body.classList.toggle('dark', on); try { localStorage.setItem(DARK_KEY, on ? '1' : '0'); } catch (e) {} }
try { setDark(localStorage.getItem(DARK_KEY) === '1'); } catch (e) {}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
</body>
</html>
