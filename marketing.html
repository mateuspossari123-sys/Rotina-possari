<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Estratégia de Marketing</title>
<link rel="manifest" href="manifest-marketing.json">
<meta name="theme-color" content="#06283a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-mkt-192.png">
<link rel="apple-touch-icon" href="icon-mkt-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marketing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* Identidade visual "30 anos — Alcançados pela Misericórdia" */
  :root {
    --navy: #06283a;
    --blue: #1c5170;
    --blue-light: #4483a3;
    --gold-1: #f3cf8f;
    --gold-2: #c9a24f;
    --gold-3: #a07a20;
    --gold-grad: linear-gradient(100deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    --cream: #fdeee0;
    --bg-page: var(--cream);
    --bg-card: #fff8f1;
    --bg-surface: #fffdfa;
    --border: #efdcc6;
    --border-input: #e3c9aa;
    --pill-bg: #f8e6d2;
    --primary: var(--blue);
    --primary-soft: #e3edf2;
    --accent: var(--gold-3);
    --ok: #2f7d5b;
    --danger: #b4432f;
    --text-1: var(--navy);
    --text-2: #1f3e50;
    --text-3: #5e6f78;
    --text-4: #8c8a85;
    --shadow-color: rgb(6 40 58 / 0.28);
  }
  body.dark {
    --bg-page: #031923;
    --bg-card: var(--navy);
    --bg-surface: #0b3449;
    --border: #164560;
    --border-input: #22587a;
    --pill-bg: #11405a;
    --primary: var(--gold-1);
    --primary-soft: #133e55;
    --accent: var(--gold-2);
    --text-1: #fdeee0;
    --text-2: #ecdcc9;
    --text-3: #a9bfcb;
    --text-4: #7f98a6;
    --shadow-color: rgb(0 0 0 / 0.5);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-page); font-family: 'Montserrat', system-ui, sans-serif; color: var(--text-1); }
  button, input, select, textarea { font-family: inherit; font-size: 14px; color: inherit; }
  ::-webkit-scrollbar { display: none; }

  .page { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px; }
  .card {
    width: 430px; max-width: 100%; min-height: 840px; background: var(--bg-card); border-radius: 28px;
    box-shadow: 0 24px 60px -20px var(--shadow-color); overflow: clip;
    display: flex; flex-direction: column; position: relative;
  }
  @media all and (display-mode: standalone) {
    .page { padding: 0; align-items: stretch; }
    .card { width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none;
      padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  }
  @media (max-width: 480px) {
    .page { padding: 0; }
    .card { border-radius: 0; min-height: 100vh; box-shadow: none; }
  }

  /* Cabeçalho: compacto (fixo no topo) e destaque na tela Início */
  header.top {
    position: sticky; top: 0; z-index: 20; color: var(--cream);
    background:
      radial-gradient(120% 140% at 50% -40%, rgb(201 162 79 / .28), transparent 60%),
      linear-gradient(180deg, #0a3249, var(--navy));
    padding: 12px 14px 12px; padding-top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
    border-radius: 0 0 22px 22px; box-shadow: 0 10px 24px -14px rgb(6 40 58 / .7);
  }
  header.top::after {
    content: ''; position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px;
    background: var(--gold-grad); border-radius: 2px; opacity: .9;
  }
  header.top .logo { width: 42px; height: 42px; flex: 0 0 auto; filter: drop-shadow(0 3px 6px rgb(0 0 0 / .4)); }
  header.top .h-text { flex: 1; min-width: 0; }
  header.top .kicker { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-1); opacity: .85; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top h1 {
    margin: 1px 0 0; font-family: 'Playfair Display', serif; font-style: italic; font-size: 23px; font-weight: 700; line-height: 1.1;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 4px;
  }
  header.top .h-sub { display: none; }
  .top-actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgb(243 207 143 / .4);
    background: rgb(243 207 143 / .08); color: var(--gold-1); cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn.back { display: none; }
  header.top.in-folder .icon-btn.back { display: flex; }
  header.top.in-folder .logo { display: none; }

  /* Destaque (Início) */
  header.top.hero {
    position: relative; flex-direction: column; text-align: center; gap: 0;
    padding: 22px 18px 24px; padding-top: max(22px, calc(env(safe-area-inset-top) + 10px)); border-radius: 0 0 34px 34px;
  }
  header.top.hero .logo { width: 92px; height: 92px; margin-bottom: 10px; filter: drop-shadow(0 8px 16px rgb(0 0 0 / .5)); }
  header.top.hero .h-text { width: 100%; }
  header.top.hero .kicker { font-size: 10px; letter-spacing: .32em; color: var(--cream); opacity: .9; }
  header.top.hero h1 { font-size: 44px; line-height: 1.05; margin-top: 2px; padding: 0 4px; }
  header.top.hero .h-sub {
    display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 11.5px; font-weight: 500; color: var(--cream);
    background: rgb(253 238 224 / .08); border: 1px solid rgb(243 207 143 / .3); border-radius: 999px; padding: 5px 12px;
  }
  header.top.hero .h-sub b { color: var(--gold-1); font-weight: 600; }
  header.top.hero .top-actions { position: absolute; top: max(14px, env(safe-area-inset-top)); right: 14px; }
  header.top.hero::after { left: 35%; right: 35%; }
  body.dark header.top { background: radial-gradient(120% 140% at 50% -40%, rgb(201 162 79 / .3), transparent 60%), linear-gradient(180deg, #0d3a54, #072c40); box-shadow: 0 1px 0 rgb(243 207 143 / .18), 0 12px 24px -12px rgb(0 0 0 / .7); }
  .icon-btn svg { width: 16px; height: 16px; }

  main { flex: 1; padding: 16px 16px 96px; overflow-y: auto; }
  .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--text-3); margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
  .section-title:first-child { margin-top: 2px; }
  .link-btn { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 12px; cursor: pointer; text-transform: none; letter-spacing: 0; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-family: 'Playfair Display', serif; font-size: 26px; line-height: 1.1; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .stat span { font-size: 10.5px; color: var(--text-3); }

  .item {
    background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
  }
  .item:active { transform: scale(.995); }
  .item .date-box { flex: 0 0 46px; text-align: center; background: var(--primary-soft); border-radius: 10px; padding: 6px 0; }
  .item .date-box b { display: block; font-family: 'Playfair Display', serif; font-size: 20px; color: var(--primary); line-height: 1.1; }
  .item .ev-box { background: var(--navy); }
  .item .ev-box b { color: #fdeee0; }
  .item .ev-box span { color: #fdeee0 !important; opacity: .85; }
  .item .date-box span { font-size: 10px; text-transform: uppercase; color: var(--text-3); }
  .item .body { flex: 1; min-width: 0; }
  .item .t { font-weight: 600; font-size: 14.5px; color: var(--text-1); overflow-wrap: anywhere; }
  .item .s { font-size: 12.5px; color: var(--text-3); margin-top: 3px; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--pill-bg); color: var(--text-2); }
  .net-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: middle; }

  .st-Ideia, .st-Planejando { background: #e6eef2; color: #4483a3; }
  .st-Produção { background: #f8e7c4; color: #8a6514; }
  .st-Agendado, .st-Confirmado { background: #d5e3ec; color: #1c5170; }
  .st-Publicado, .st-Realizado { background: #06283a; color: #f3cf8f; }
  .st-Cancelado { background: #f5ddd6; color: #b4432f; }
  body.dark .st-Ideia, body.dark .st-Planejando { background: #163f57; color: #9cc6dc; }
  body.dark .st-Produção { background: #4a3a14; color: #f3cf8f; }
  body.dark .st-Agendado, body.dark .st-Confirmado { background: #1c5170; color: #fdeee0; }
  body.dark .st-Publicado, body.dark .st-Realizado { background: var(--gold-grad); color: #06283a; }
  body.dark .st-Cancelado { background: #4d2219; color: #f0a593; }

  .progress { height: 6px; background: var(--pill-bg); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .progress i { display: block; height: 100%; background: var(--gold-grad); border-radius: 99px; }

  .empty { text-align: center; color: var(--text-4); font-size: 13px; padding: 22px 10px; border: 1.5px dashed var(--border); border-radius: 14px; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .chip { flex: 0 0 auto; border: 1px solid var(--border); background: var(--bg-surface); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
  .chip.on { background: var(--primary); border-color: var(--primary); color: white; }
  body.dark .chip.on { color: var(--navy); }

  /* Calendário */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; text-transform: capitalize; }
  .cal-nav { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--bg-surface); cursor: pointer; font-size: 16px; color: var(--text-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: 10.5px; text-align: center; color: var(--text-4); font-weight: 600; padding-bottom: 4px; }
  .cal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .seg { display: inline-flex; background: var(--pill-bg); border-radius: 999px; padding: 3px; }
  .seg button { border: none; background: none; padding: 6px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--text-3); cursor: pointer; }
  .seg button.on { background: var(--navy); color: var(--gold-1); }
  body.dark .seg button.on { background: var(--gold-grad); color: var(--navy); }
  .cal-grid { gap: 3px; }
  .cal-day {
    min-height: 78px; border-radius: 8px; background: var(--bg-surface); border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: stretch; gap: 2px; padding: 3px 2px; cursor: pointer; color: var(--text-2); min-width: 0; overflow: hidden;
  }
  .cal-day .n { font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.3; border-radius: 99px; }
  .cal-day.out { opacity: .4; }
  .cal-day.today .n { background: var(--navy); color: var(--gold-1); }
  body.dark .cal-day.today .n { background: var(--gold-1); color: var(--navy); }
  .cal-day.sel { border: 2px solid var(--gold-2); box-shadow: 0 0 0 2px rgb(201 162 79 / .25); }
  .cc { display: block; font-size: 8.5px; line-height: 1.35; padding: 0 3px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-ev { color: #fff; font-weight: 700; }
  .cc-post { border-left: 2.5px solid; background: var(--pill-bg); color: var(--text-2); }
  .cc-task { font-weight: 600; color: var(--text-3); }
  .cc-task i { font-style: normal; }
  body.dark .cc-task i, body.dark .net-dot { box-shadow: 0 0 0 1px rgb(253 238 224 / .35); border-radius: 50%; }
  .cc-task.done { text-decoration: line-through; opacity: .6; }
  .cc-more { font-size: 8.5px; color: var(--text-4); text-align: center; font-weight: 600; }
  .section-title.is-today { color: var(--accent); }
  /* Pastas */
  .folders { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  .folder { position: relative; cursor: pointer; padding-top: 12px; }
  .folder .f-tab { position: absolute; top: 0; left: 0; width: 46%; height: 18px; background: var(--c); border-radius: 10px 14px 0 0; }
  .folder .f-body { position: relative; background: var(--bg-surface); border: 1px solid var(--border); border-top: 5px solid var(--c); border-radius: 0 14px 14px 14px; padding: 10px 10px 12px; min-height: 120px; display: flex; flex-direction: column; }
  .folder .f-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16.5px; line-height: 1.2; margin: 4px 0 6px; flex: 1; overflow-wrap: anywhere; }
  .f-date { font-size: 11px; color: var(--text-3); font-weight: 500; }
  .f-meta { font-size: 11px; color: var(--text-3); }
  .back-btn { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 13px; padding: 0 0 10px; cursor: pointer; }
  .f-hero { background: var(--bg-surface); border: 1px solid var(--border); border-left: 6px solid var(--c); border-radius: 14px; padding: 12px; }
  .f-hero-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .f-hero-top .btn { flex: 0 0 auto; }
  .f-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; line-height: 1.15; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .subtabs { margin-top: 12px; }
  .box { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 2px 10px; margin-bottom: 8px; }
  .box .task:last-child { border-bottom: none; }
  .hint { font-size: 12px; color: var(--text-3); margin: 8px 2px; }
  .m-line { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; cursor: pointer; }
  .m-line:last-child { border-bottom: none; }
  .m-line span { color: var(--accent); font-weight: 600; font-size: 12px; text-align: right; }
  .member { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
  .m-head { display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .m-role { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 1px; }
  .m-head .body { flex: 1; min-width: 0; }
  .wa { font-size: 11.5px; font-weight: 600; color: #fff; background: #2f9e62; padding: 6px 10px; border-radius: 99px; text-decoration: none; flex: 0 0 auto; }
  .m-resp { font-size: 13px; color: var(--text-2); margin-top: 8px; white-space: pre-wrap; background: var(--pill-bg); border-radius: 10px; padding: 8px 10px; }
  .m-tasks { margin-top: 8px; }
  .m-tasks > .meta { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
  .member .t { font-weight: 600; font-size: 15px; }
  .member .s { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }
  .m-tasks .task:last-child { border-bottom: none; }
  .task .tx { cursor: pointer; }
  .area { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
  .area-h { display: flex; justify-content: space-between; align-items: baseline; }
  .area-h b { font-size: 15px; }
  .area-h span { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 18px; color: var(--accent); }
  .falta-list { margin: 8px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--text-3); line-height: 1.6; }
  .falta-list li::marker { content: '○  '; color: var(--danger); }
  .area-ok { font-size: 12.5px; color: var(--ok); margin-top: 8px; font-weight: 600; }
  .falta { color: var(--danger); font-style: italic; font-weight: 500; }
  .f-tema { font-family: 'Playfair Display', serif; font-style: italic; color: var(--accent); font-size: 15px; margin-bottom: 4px; }
  .field-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; cursor: pointer; }
  .fc-label { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
  .fc-val { font-size: 15px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  .fc-val.small { font-size: 13px; font-weight: 400; white-space: pre-wrap; color: var(--text-2); }
  .fc-val.tema { font-family: 'Playfair Display', serif; font-style: italic; font-size: 19px; color: var(--accent); }
  .fc-edit { font-size: 12px; color: var(--primary); font-weight: 600; flex: 0 0 auto; }
  .post-line { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .post-line:last-child { border-bottom: none; }
  .pl-date { flex: 0 0 42px; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 14px; color: var(--primary); text-align: center; line-height: 1.2; }
  .pl-body { flex: 1; min-width: 0; font-size: 13.5px; }
  .pl-body b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .pl-body small { color: var(--text-3); font-size: 11.5px; }
  .btn.wide { width: 100%; margin-top: 4px; }
  .timeline { border-left: 2px solid var(--gold-2); margin-left: 26px; padding-left: 0; }
  .tl-item { display: flex; gap: 12px; align-items: flex-start; margin: 0 0 8px -27px; cursor: pointer; }
  .tl-hora { flex: 0 0 auto; background: var(--navy); color: var(--gold-1); font-size: 11.5px; font-weight: 700; padding: 4px 7px; border-radius: 8px; }
  body.dark .tl-hora { background: var(--gold-1); color: var(--navy); }
  .tl-body { flex: 1; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; font-size: 13.5px; }
  .tl-body b { display: block; }
  .tl-body small { color: var(--text-3); font-size: 12px; }
  .time-pick { display: flex; align-items: center; gap: 4px; }
  .time-pick select { flex: 1; min-width: 0; padding: 10px 6px; text-align: center; }
  .time-pick span { font-weight: 700; color: var(--text-3); }
  label.chk { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13.5px; }
  label.chk input { width: 18px; height: 18px; accent-color: var(--blue); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .sw.on { border-color: var(--bg-card); box-shadow: 0 0 0 2px var(--gold-2); }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: var(--text-3); margin: 10px 2px 0; }

  /* Tabs */
  nav.tabs {
    position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--bg-card); border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  @media all and (display-mode: standalone), (max-width: 480px) { nav.tabs { position: fixed; } }
  .tab { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--text-4); cursor: pointer; padding: 4px 0; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--primary); font-weight: 600; }
  body:not(.dark) .tab.on { color: var(--navy); }
  .tab.on svg { stroke: var(--accent); }

  .fab {
    position: absolute; right: 18px; bottom: 78px; width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--gold-1);
    background: var(--gold-grad); color: var(--navy); font-size: 30px; font-weight: 500; cursor: pointer; box-shadow: 0 10px 22px -6px var(--shadow-color);
  }
  @media all and (display-mode: standalone), (max-width: 480px) { .fab { position: fixed; } }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgb(3 25 35 / .55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  .sheet {
    background: var(--bg-card); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .sheet h2 { margin: 0 0 12px; font-family: 'Playfair Display', serif; font-size: 22px; display: flex; justify-content: space-between; align-items: center; }
  .close-x { background: var(--pill-bg); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--text-2); }
  label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-3); margin: 10px 0 4px; }
  .in { width: 100%; padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 10px; background: var(--bg-surface); outline: none; }
  .in:focus { border-color: var(--primary); }
  textarea.in { min-height: 80px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  .btn { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-surface); font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: white; }
  body.dark .btn.primary { color: var(--navy); }
  .btn.danger { color: var(--danger); flex: 0 0 auto; }
  .btn.small { padding: 8px 10px; font-size: 12.5px; }

  /* Detalhe do evento */
  .ev-info { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; font-size: 13px; color: var(--text-2); line-height: 1.6; }
  .ev-info b { color: var(--text-1); }
  .fase { margin-top: 14px; }
  .fase h3 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 6px; color: var(--accent); }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .task input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--blue); margin-top: 1px; flex: 0 0 auto; }
  .task .tx { flex: 1; font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
  .task.done .tx { text-decoration: line-through; color: var(--text-4); }
  .task .meta { font-size: 11px; color: var(--text-4); }
  .task .meta.late { color: var(--danger); font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--text-1); color: var(--bg-card); padding: 10px 16px; border-radius: 99px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; }
  .copy-box { white-space: pre-wrap; font-size: 13px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; color: var(--text-2); margin-top: 6px; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <header class="top hero" id="hdr">
      <button class="icon-btn back" id="btnBack" aria-label="Voltar para as pastas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <img class="logo" src="logo-30anos.png" alt="30 anos — Alcançados pela Misericórdia">
      <div class="h-text">
        <div class="kicker" id="hdrKicker">Alcançados pela</div>
        <h1 id="hdrTitle">Misericórdia</h1>
        <div class="h-sub" id="hdrSub"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="btnBackup" title="Backup" aria-label="Backup dos dados">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
        </button>
        <button class="icon-btn" id="btnDark" title="Modo escuro" aria-label="Alternar modo escuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main id="view"></main>

    <button class="fab" id="fab" aria-label="Adicionar">+</button>

    <nav class="tabs">
      <button class="tab on" data-tab="inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Início
      </button>
      <button class="tab" data-tab="calendario">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendário
      </button>
      <button class="tab" data-tab="posts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>Posts
      </button>
      <button class="tab" data-tab="eventos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Eventos
      </button>
    </nav>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const STORE_KEY = 'mkt-estrategia-v1';
const DARK_KEY = 'mkt-dark';

const REDES = {
  Instagram: '#c9467a',
  Facebook: '#3b5fa8',
  TikTok: '#2b2b2b',
  WhatsApp: '#2f9e62',
  YouTube: '#c8322b',
  LinkedIn: '#1c6fa0',
  'E-mail': '#c9a24f',
  Outro: '#8c8a85',
};
const FORMATOS = ['Feed', 'Carrossel', 'Reels', 'Stories', 'Vídeo', 'Live', 'Texto', 'Outro'];
const STATUS_POST = ['Ideia', 'Produção', 'Agendado', 'Publicado'];
const STATUS_EV = ['Planejando', 'Confirmado', 'Realizado', 'Cancelado'];
const FASES = ['Pré-evento', 'Dia do evento'];

const MODELO_TAREFAS = [
  ['Pré-evento', 'Definir objetivo e público-alvo', -45],
  ['Pré-evento', 'Fechar local, data e horário', -40],
  ['Pré-evento', 'Montar orçamento', -40],
  ['Pré-evento', 'Criar identidade visual (arte, cores, logo)', -30],
  ['Pré-evento', 'Contratar fornecedores (som, buffet, foto/vídeo)', -25],
  ['Pré-evento', 'Abrir inscrições / vendas / convites', -21],
  ['Pré-evento', 'Produzir posts de divulgação', -16],
  ['Pré-evento', 'Confirmar presença dos convidados', -3],
  ['Pré-evento', 'Checklist de materiais e equipe', -1],
  ['Dia do evento', 'Cobertura em Stories ao vivo', 0],
  ['Dia do evento', 'Fotos e vídeos para conteúdo', 0],
  ['Dia do evento', 'Coletar depoimentos', 0],
];
const MODELO_POSTS = [
  [-14, 'Teaser: algo vem aí 👀', 'Instagram', 'Stories'],
  [-10, 'Anúncio oficial do evento', 'Instagram', 'Carrossel'],
  [-7, 'O que vai acontecer (programação)', 'Instagram', 'Reels'],
  [-7, 'Convite no grupo/lista', 'WhatsApp', 'Texto'],
  [-3, 'Contagem regressiva: faltam 3 dias', 'Instagram', 'Stories'],
  [-1, 'É amanhã! Últimas informações', 'Instagram', 'Feed'],
  [0, 'Ao vivo do evento', 'Instagram', 'Stories'],
  [1, 'Obrigado a todos que vieram!', 'Instagram', 'Carrossel'],
  [3, 'Vídeo resumo do evento', 'Instagram', 'Reels'],
];

// ---------- Store ----------
let store = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.posts) && Array.isArray(s.eventos)) {
      // A fase "Pós-evento" foi removida
      s.eventos.forEach(e => { e.tarefas = (e.tarefas || []).filter(x => x.fase !== 'Pós-evento'); });
      return s;
    }
  } catch (e) {}
  return { posts: [], eventos: [] };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { toast('Não foi possível salvar'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- Helpers ----------
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const fmtLong = s => { const d = parse(s); return `${DOW[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const diffDays = s => Math.round((parse(s) - parse(today())) / 86400000);
const relLabel = s => { const n = diffDays(s); return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n === -1 ? 'ontem' : n > 0 ? `em ${n} dias` : `há ${-n} dias`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const opts = (arr, sel) => arr.map(v => `<option ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');
const byDate = (a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''));
const evById = id => store.eventos.find(e => e.id === id);
const money = v => v ? Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- Eventos: cores e funções ----------
const CORES_EV = ['#1c5170', '#a07a20', '#4483a3', '#7a3b5c', '#2f7d5b', '#06283a', '#b4432f', '#5b4a8a'];
const FUNCOES = ['Coordenação geral', 'Comunicação / Redes sociais', 'Design / Artes', 'Fotografia', 'Filmagem', 'Liturgia',
  'Música', 'Recepção', 'Decoração', 'Som e luz', 'Alimentação', 'Financeiro', 'Logística', 'Voluntários', 'Segurança'];
function evColor(e) {
  if (e && e.cor) return e.cor;
  const i = e ? [...e.id].reduce((a, c) => a + c.charCodeAt(0), 0) : 0;
  return CORES_EV[i % CORES_EV.length];
}
const initials = n => n.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();

// ---------- Navegação ----------
let tab = 'inicio';
let postFilter = 'Todos';
let evFilter = 'Próximos';
let calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
let calSel = today();
let calMode = 'Mês';
let calFilter = 'Tudo';
let openEvId = null;
let evTab = 'geral';

function setTab(t) {
  tab = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === t));
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  openEvId = null;
  setTab(b.dataset.tab);
  render();
  document.getElementById('view').scrollTop = 0;
  window.scrollTo(0, 0);
});
function openFolder(id, sub = 'geral') {
  closeSheet();
  openEvId = id; evTab = sub;
  setTab('eventos');
  render();
  window.scrollTo(0, 0);
}
document.getElementById('fab').onclick = () => {
  if (tab === 'eventos' && openEvId) {
    const e = evById(openEvId);
    if (evTab === 'equipe') openMemberForm(openEvId);
    else if (evTab === 'tarefas') openTaskForm(openEvId);
    else if (evTab === 'estrutura' || evTab === 'org') {
      const btn = [...document.querySelectorAll('.section-title .link-btn')].pop();
      if (btn) btn.click();
    } else openPostForm({ eventoId: openEvId, data: e.data > today() ? addDays(e.data, -7) : today() });
  } else if (tab === 'eventos') openEventForm();
  else if (tab === 'calendario') openPostForm({ data: calSel });
  else openPostForm();
};

function render() {
  const titles = { inicio: 'Início', calendario: 'Calendário', posts: 'Posts', eventos: 'Eventos' };
  const v = document.getElementById('view');
  ACTS = {};
  if (tab === 'eventos' && openEvId && !evById(openEvId)) openEvId = null;
  renderHeader(titles);
  v.innerHTML = tab === 'eventos' && openEvId ? viewPasta()
    : ({ inicio: viewInicio, calendario: viewCalendario, posts: viewPosts, eventos: viewEventos })[tab]();
  bindItems(v);
}

function renderHeader(titles) {
  const hdr = document.getElementById('hdr');
  const ev = tab === 'eventos' && openEvId && evById(openEvId);
  const hero = tab === 'inicio';
  hdr.classList.toggle('hero', hero);
  hdr.classList.toggle('in-folder', !!ev);
  const k = document.getElementById('hdrKicker'), h1 = document.getElementById('hdrTitle');
  if (hero) {
    k.textContent = 'Alcançados pela';
    h1.textContent = 'Misericórdia';
    const d = new Date();
    const prox = store.eventos.filter(e => e.data >= today() && e.status !== 'Cancelado').sort(byDate)[0];
    document.getElementById('hdrSub').innerHTML = `${DOW[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}` +
      (prox ? ` · <b>${esc(prox.nome)} ${relLabel(prox.data)}</b>` : ' · <b>30 anos · 1996–2026</b>');
  } else if (ev) {
    k.textContent = 'Pasta do evento';
    h1.textContent = ev.nome;
  } else {
    k.textContent = 'Alcançados pela Misericórdia';
    h1.textContent = titles[tab];
  }
}
document.getElementById('btnBack').onclick = () => { openEvId = null; render(); window.scrollTo(0, 0); };

function bindItems(root) {
  root.querySelectorAll('[data-post]').forEach(el => el.onclick = ev => { ev.stopPropagation(); openPostForm(store.posts.find(p => p.id === el.dataset.post)); });
  root.querySelectorAll('[data-ev]').forEach(el => el.onclick = ev => { ev.stopPropagation(); openFolder(el.dataset.ev, el.dataset.sub || 'geral'); });
  root.querySelectorAll('[data-go]').forEach(el => el.onclick = () => document.querySelector(`.tab[data-tab="${el.dataset.go}"]`).click());
  root.querySelectorAll('[data-tkev]').forEach(cb => {
    cb.onclick = ev => ev.stopPropagation();
    cb.onchange = () => {
      const t = (evById(cb.dataset.tkev).tarefas || []).find(x => x.id === cb.dataset.tk);
      if (t) { t.feito = cb.checked; save(); render(); }
    };
  });
  root.querySelectorAll('[data-act]').forEach(el => el.onclick = ev => { ev.stopPropagation(); ACTS[el.dataset.act] && ACTS[el.dataset.act](); });
  root.querySelectorAll('[data-tkedit]').forEach(el => el.onclick = ev => { ev.stopPropagation(); openTaskForm(el.dataset.tkevid, el.dataset.tkedit); });
}

// ---------- Cards ----------
function postCard(p) {
  const d = parse(p.data);
  const ev = p.eventoId && evById(p.eventoId);
  return `<div class="item" data-post="${p.id}">
    <div class="date-box"><b>${d.getDate()}</b><span>${MES_CURTO[d.getMonth()]}</span></div>
    <div class="body">
      <div class="t">${esc(p.titulo)}</div>
      <div class="s"><span class="net-dot" style="background:${REDES[p.rede] || REDES.Outro}"></span>${esc(p.rede)} · ${esc(p.formato)}${p.hora ? ' · ' + esc(p.hora) : ''}${p.responsavel ? ' · 👤 ' + esc(p.responsavel) : ''}</div>
      <div class="tags"><span class="tag st-${esc(p.status)}">${esc(p.status)}</span>${ev ? `<span class="tag" style="border-left:3px solid ${evColor(ev)}">📁 ${esc(ev.nome)}</span>` : ''}</div>
    </div></div>`;
}
function evProgress(e) {
  const t = e.tarefas || [];
  const done = t.filter(x => x.feito).length;
  return { done, total: t.length, pct: t.length ? Math.round(done / t.length * 100) : 0 };
}
function evCard(e) {
  const d = parse(e.data);
  const pr = evProgress(e);
  const nPosts = store.posts.filter(p => p.eventoId === e.id).length;
  return `<div class="item" data-ev="${e.id}">
    <div class="date-box ev-box" style="background:${evColor(e)}"><b>${d.getDate()}</b><span>${MES_CURTO[d.getMonth()]}</span></div>
    <div class="body">
      <div class="t">📁 ${esc(e.nome)}</div>
      <div class="s">${relLabel(e.data)}${e.local ? ' · ' + esc(e.local) : ''}</div>
      <div class="tags"><span class="tag st-${esc(e.status)}">${esc(e.status)}</span><span class="tag">👥 ${(e.equipe || []).length}</span><span class="tag">✅ ${pr.done}/${pr.total}</span><span class="tag">📣 ${nPosts}</span></div>
      ${pr.total ? `<div class="progress"><i style="width:${pr.pct}%"></i></div>` : ''}
    </div></div>`;
}
function taskRow(x, e, showEv) {
  const t = today();
  const late = !x.feito && x.prazo && x.prazo < t;
  return `<div class="task ${x.feito ? 'done' : ''}">
    <input type="checkbox" data-tkev="${e.id}" data-tk="${x.id}" ${x.feito ? 'checked' : ''} aria-label="Concluir tarefa">
    <div class="tx" data-tkedit="${x.id}" data-tkevid="${e.id}">${esc(x.texto)}
      <div class="meta ${late ? 'late' : ''}">${x.prazo ? `${parse(x.prazo).getDate()} ${MES_CURTO[parse(x.prazo).getMonth()]} (${relLabel(x.prazo)})` : 'sem prazo'}${x.responsavel ? ' · 👤 ' + esc(x.responsavel) : ' · <i>sem responsável</i>'}${showEv ? ` · <span class="net-dot" style="background:${evColor(e)};border-radius:2px;margin-left:2px"></span>${esc(e.nome)}` : ''}</div>
    </div>
  </div>`;
}

// ---------- Views ----------
function viewInicio() {
  const t = today();
  const semana = addDays(t, 7);
  const proxPosts = store.posts.filter(p => p.data >= t && p.status !== 'Publicado').sort(byDate);
  const atrasados = store.posts.filter(p => p.data < t && p.status !== 'Publicado').sort(byDate);
  const proxEv = store.eventos.filter(e => e.data >= t && e.status !== 'Cancelado' && e.status !== 'Realizado').sort(byDate);
  const tarefasPend = [];
  store.eventos.forEach(e => (e.tarefas || []).forEach(x => { if (!x.feito && x.prazo && x.prazo <= semana && e.status !== 'Cancelado') tarefasPend.push({ x, e }); }));
  tarefasPend.sort((a, b) => a.x.prazo.localeCompare(b.x.prazo));

  const semanaCount = store.posts.filter(p => p.data >= t && p.data <= semana).length;
  const publicados = store.posts.filter(p => p.status === 'Publicado').length;

  let h = `<div class="section-title">Resumo</div>
  <div class="stats">
    <div class="stat"><b>${semanaCount}</b><span>posts em 7 dias</span></div>
    <div class="stat"><b>${proxEv.length}</b><span>eventos</span></div>
    <div class="stat"><b>${tarefasPend.length}</b><span>tarefas p/ fazer</span></div>
    <div class="stat"><b>${publicados}</b><span>publicados</span></div>
  </div>`;

  if (atrasados.length) {
    h += `<div class="section-title" style="color:var(--danger)">⚠️ Atrasados (não publicados)</div>` + atrasados.map(postCard).join('');
  }
  h += `<div class="section-title">Próximas postagens <button class="link-btn" data-go="posts">ver todas</button></div>`;
  h += proxPosts.length ? proxPosts.slice(0, 5).map(postCard).join('') : `<div class="empty">Nenhuma postagem planejada.<br>Toque em <b>+</b> para adicionar.</div>`;

  h += `<div class="section-title">Próximos eventos <button class="link-btn" data-go="eventos">ver pastas</button></div>`;
  h += proxEv.length ? proxEv.slice(0, 3).map(evCard).join('') : `<div class="empty">Nenhum evento planejado.</div>`;

  if (tarefasPend.length) {
    h += `<div class="section-title">Tarefas desta semana</div><div class="box">`;
    h += tarefasPend.slice(0, 8).map(({ x, e }) => taskRow(x, e, true)).join('') + '</div>';
  }
  return h;
}

// ---------- Calendário geral ----------
function itensDoDia(s) {
  const out = [];
  if (calFilter === 'Tudo' || calFilter === 'Eventos')
    store.eventos.filter(e => e.data === s).forEach(e => out.push({ tipo: 'ev', e }));
  if (calFilter === 'Tudo' || calFilter === 'Posts')
    store.posts.filter(p => p.data === s).sort(byDate).forEach(p => out.push({ tipo: 'post', p }));
  if (calFilter === 'Tudo' || calFilter === 'Tarefas')
    store.eventos.forEach(e => (e.tarefas || []).forEach(x => { if (x.prazo === s) out.push({ tipo: 'task', x, e }); }));
  return out;
}
function chipCal(it) {
  if (it.tipo === 'ev') return `<span class="cc cc-ev" style="background:${evColor(it.e)}">${esc(it.e.nome)}</span>`;
  if (it.tipo === 'post') {
    const ev = it.p.eventoId && evById(it.p.eventoId);
    return `<span class="cc cc-post" style="border-color:${REDES[it.p.rede] || REDES.Outro};${ev ? `background:${evColor(ev)}22` : ''}">${esc(it.p.titulo)}</span>`;
  }
  return `<span class="cc cc-task ${it.x.feito ? 'done' : ''}"><i style="color:${evColor(it.e)}">${it.x.feito ? '✓' : '●'}</i> ${esc(it.x.texto)}</span>`;
}
function itemCard(it) {
  if (it.tipo === 'ev') return evCard(it.e);
  if (it.tipo === 'post') return postCard(it.p);
  return `<div class="box">${taskRow(it.x, it.e, true)}</div>`;
}
function viewCalendario() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const t = today();
  setTimeout(() => {
    document.querySelectorAll('[data-day]').forEach(el => el.onclick = () => { calSel = el.dataset.day; render(); });
    document.querySelectorAll('[data-cm]').forEach(el => el.onclick = () => { calMode = el.dataset.cm; render(); });
    document.querySelectorAll('[data-cf]').forEach(el => el.onclick = () => { calFilter = el.dataset.cf; render(); });
    document.getElementById('calPrev').onclick = () => { calMonth = new Date(y, m - 1, 1); render(); };
    document.getElementById('calNext').onclick = () => { calMonth = new Date(y, m + 1, 1); render(); };
    document.getElementById('calHoje').onclick = () => { const d = new Date(); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); calSel = today(); render(); };
  });

  let h = `<div class="cal-head"><button class="cal-nav" id="calPrev" aria-label="Mês anterior">‹</button>
    <b>${MESES[m]} ${y}</b>
    <button class="cal-nav" id="calNext" aria-label="Próximo mês">›</button></div>
  <div class="cal-bar">
    <div class="seg">${['Mês', 'Agenda'].map(x => `<button class="${x === calMode ? 'on' : ''}" data-cm="${x}">${x}</button>`).join('')}</div>
    <button class="link-btn" id="calHoje">Hoje</button>
  </div>
  <div class="chips">${['Tudo', 'Eventos', 'Posts', 'Tarefas'].map(f => `<button class="chip ${f === calFilter ? 'on' : ''}" data-cf="${f}">${f}</button>`).join('')}</div>`;

  if (calMode === 'Mês') {
    const start = new Date(y, m, 1 - new Date(y, m, 1).getDay());
    let cells = DOW.map(d => `<div class="cal-dow">${d[0]}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const s = iso(d);
      const its = itensDoDia(s);
      const more = its.length > 3 ? `<span class="cc-more">+${its.length - 3}</span>` : '';
      cells += `<div class="cal-day ${d.getMonth() !== m ? 'out' : ''} ${s === t ? 'today' : ''} ${s === calSel ? 'sel' : ''}" data-day="${s}">
        <span class="n">${d.getDate()}</span>${its.slice(0, 3).map(chipCal).join('')}${more}</div>`;
    }
    h += `<div class="cal-grid">${cells}</div>`;
    const evMes = store.eventos.filter(e => parse(e.data).getMonth() === m && parse(e.data).getFullYear() === y);
    h += `<div class="legend">${evMes.map(e => `<span><span class="net-dot" style="background:${evColor(e)};border-radius:2px"></span>${esc(e.nome)}</span>`).join('')}
      <span><span class="net-dot" style="border:2px solid var(--text-3);background:none;border-radius:2px"></span>Post (borda = rede)</span><span>● Tarefa</span></div>`;
    const its = itensDoDia(calSel);
    h += `<div class="section-title">${fmtLong(calSel)}</div>`;
    h += its.length ? its.map(itemCard).join('') : `<div class="empty">Nada neste dia. Toque em <b>+</b> para planejar um post.</div>`;
  } else {
    const last = new Date(y, m + 1, 0).getDate();
    let any = false;
    for (let dd = 1; dd <= last; dd++) {
      const s = iso(new Date(y, m, dd));
      const its = itensDoDia(s);
      if (!its.length) continue;
      any = true;
      h += `<div class="section-title ${s === t ? 'is-today' : ''}">${fmtLong(s)}${s === t ? ' · hoje' : ''}</div>` + its.map(itemCard).join('');
    }
    if (!any) h += `<div class="empty">Nada planejado neste mês.</div>`;
  }
  return h;
}

function viewPosts() {
  setTimeout(() => document.querySelectorAll('[data-pf]').forEach(el => el.onclick = () => { postFilter = el.dataset.pf; render(); }));
  const filtros = ['Todos', 'Próximos', ...STATUS_POST];
  let list = store.posts.slice().sort(byDate);
  if (postFilter === 'Próximos') list = list.filter(p => p.data >= today());
  else if (postFilter !== 'Todos') list = list.filter(p => p.status === postFilter);
  let h = `<div class="chips">${filtros.map(f => `<button class="chip ${f === postFilter ? 'on' : ''}" data-pf="${f}">${f}</button>`).join('')}</div>`;
  if (!list.length) return h + `<div class="empty">Nenhum post aqui ainda.<br>Toque em <b>+</b> para criar.</div>`;
  let lastMonth = '';
  list.forEach(p => {
    const d = parse(p.data);
    const mk = `${MESES[d.getMonth()]} ${d.getFullYear()}`;
    if (mk !== lastMonth) { h += `<div class="section-title">${mk}</div>`; lastMonth = mk; }
    h += postCard(p);
  });
  return h;
}

// Ações dos elementos renderizados: data-act="aN" -> função
let ACTS = {}, actSeq = 0;
const act = fn => { const k = 'a' + (++actSeq); ACTS[k] = fn; return `data-act="${k}"`; };

function waLink(contato) {
  const tel = (contato || '').replace(/\D/g, '');
  if (tel.length < 10) return '';
  return `<a class="wa" href="https://wa.me/${tel.length <= 11 ? '55' + tel : tel}" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>`;
}
const pessoa = n => n ? `👤 ${esc(n)}` : '<i class="falta">definir responsável</i>';

// Seletor de horário (hora + minuto) que funciona igual em qualquer celular
function timePick(id, value) {
  const [vh, vm] = (value || '').split(':');
  const mins = [...new Set(['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55', ...(vm ? [vm] : [])])].sort();
  const hs = Array.from({ length: 24 }, (_, i) => pad(i));
  return `<div class="time-pick" id="${id}">
    <select class="in" data-part="h" aria-label="Hora"><option value="">--</option>${hs.map(x => `<option ${x === vh ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <span>:</span>
    <select class="in" data-part="m" aria-label="Minutos">${mins.map(x => `<option ${x === (vm || '00') ? 'selected' : ''}>${x}</option>`).join('')}</select>
  </div>`;
}
function readTime(id) {
  const box = document.getElementById(id);
  const h = box.querySelector('[data-part=h]').value;
  return h ? `${h}:${box.querySelector('[data-part=m]').value}` : '';
}

// Formulário genérico em folha inferior
function openForm({ title, fields, vals = {}, onSave, onDelete, people = [] }) {
  const ctl = f => {
    const v = vals[f.k] ?? '';
    const ph = f.ph ? `placeholder="${esc(f.ph)}"` : '';
    if (f.type === 'textarea') return `<textarea class="in" id="ff_${f.k}" ${ph}>${esc(v)}</textarea>`;
    if (f.type === 'select') return `<select class="in" id="ff_${f.k}">${opts(f.options, v || f.options[0])}</select>`;
    if (f.type === 'time') return timePick(`ff_${f.k}`, v);
    if (f.type === 'check') return `<label class="chk"><input type="checkbox" id="ff_${f.k}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
    const type = f.type === 'person' ? 'text' : (f.type || 'text');
    return `<input class="in" id="ff_${f.k}" type="${type}" ${f.type === 'person' ? 'list="ffPeople"' : ''} ${ph} value="${esc(v)}">`;
  };
  openSheet(`<h2>${esc(title)} <button class="close-x">✕</button></h2>
    ${fields.map(f => f.type === 'check' ? ctl(f) : `<label class="f">${esc(f.label)}${f.req ? ' *' : ''}</label>${ctl(f)}`).join('')}
    <datalist id="ffPeople">${people.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="btns">${onDelete ? '<button class="btn danger" id="ffDel">Excluir</button>' : ''}<button class="btn primary" id="ffSave">Salvar</button></div>`);
  document.getElementById('ffSave').onclick = () => {
    const out = {};
    for (const f of fields) {
      const el = document.getElementById('ff_' + f.k);
      out[f.k] = f.type === 'check' ? el.checked : f.type === 'time' ? readTime('ff_' + f.k) : el.value.trim();
      if (f.req && !out[f.k]) { toast(`Preencha: ${f.label}`); return; }
    }
    onSave(out); save(); closeSheet(); render(); toast('Salvo');
  };
  if (onDelete) document.getElementById('ffDel').onclick = () => {
    if (!confirm('Excluir este item?')) return;
    onDelete(); save(); closeSheet(); render();
  };
}

  const posts = store.posts.filter(p => p.eventoId === e.id);

  return {
    marketing: [

      ['Cobertura do dia com responsáveis', m.cobertura.length > 0 && m.cobertura.every(c => c.responsavel)],

      ['Ministério de música definido', !!(o.musica.nome || o.musica.responsavel)],

      <div class="section-title">Ministério de música</div>
      <div class="member" ${edit('Ministério de música', [{ k: 'nome', label: 'Nome do ministério / banda' }, { k: 'responsavel', label: 'Responsável', type: 'person' },
        { k: 'contato', label: 'Contato (WhatsApp)', type: 'tel' }, { k: 'notas', label: 'Repertório, horário de passagem de som, necessidades', type: 'textarea' }, { k: 'confirmado', label: 'Confirmado', type: 'check' }], mu)}>
        <div class="m-head"><div class="avatar" style="background:${evColor(e)}">🎵</div>
        <div class="body"><div class="t">${mu.nome ? esc(mu.nome) : '<i class="falta">definir ministério</i>'}</div>
        <div class="s">${pessoa(mu.responsavel)} · ${mu.confirmado ? '<b style="color:var(--ok)">✔ confirmado</b>' : '<b style="color:var(--danger)">não confirmado</b>'}</div></div>
        ${waLink(mu.contato)}</div>
        ${mu.notas ? `<div class="m-resp">${esc(mu.notas)}</div>` : ''}</div>

      <div class="section-title">Cronograma do evento <button class="link-btn" ${act(() => cronForm())}>+ momento</button></div>
      ${o.cronograma.length ? `<div class="timeline">${o.cronograma.slice().sort((a, b) => a.hora.localeCompare(b.hora)).map(c => `
        <div class="tl-item" ${act(() => cronForm(c))}><span class="tl-hora">${esc(c.hora)}</span>
        <div class="tl-body"><b>${esc(c.atividade)}</b><small>${pessoa(c.responsavel)}</small></div></div>`).join('')}</div>`
        : `<div class="empty">Monte a programação: acolhida, louvor, pregação, missa, encerramento...</div>`}`;
  }

  // ----- Estrutura -----
  if (evTab === 'estrutura') {
    const frenteForm = (f = {}) => openForm({
      title: f.id ? f.nome : 'Nova frente de estrutura', people, vals: f,
      fields: [{ k: 'nome', label: 'Frente', req: true, ph: 'Ex.: Decoração, Estacionamento' }, { k: 'responsavel', label: 'Responsável', type: 'person' },
        { k: 'contato', label: 'Contato / fornecedor', type: 'tel' }, { k: 'horario', label: 'Quando (montagem / chegada)', ph: 'Ex.: Sábado 14h' },
        { k: 'status', label: 'Status', type: 'select', options: STATUS_FRENTE }, { k: 'notas', label: 'O que precisa, valores, observações', type: 'textarea' }],
      onSave: v => f.id ? Object.assign(f, v) : e.estrutura.push({ id: uid(), ...v }),
      onDelete: f.id ? () => { e.estrutura = e.estrutura.filter(x => x !== f); } : null,
    });
    const prontas = e.estrutura.filter(f => f.status === 'Pronto').length;
    h += `<div class="section-title">Frentes · ${prontas}/${e.estrutura.length} prontas <button class="link-btn" ${act(() => frenteForm())}>+ frente</button></div>`;
    h += e.estrutura.map(f => `<div class="member" ${act(() => frenteForm(f))}>
        <div class="m-head"><div class="body"><div class="t">${esc(f.nome)}</div>
        <div class="s">${pessoa(f.responsavel)}${f.horario ? ' · 🕒 ' + esc(f.horario) : ''}</div></div>
        <span class="tag ${ST_FRENTE_CLS[f.status] || ''}">${esc(f.status)}</span></div>
        ${f.notas ? `<div class="m-resp">${esc(f.notas)}</div>` : ''}
        ${f.contato ? `<div class="s" style="margin-top:6px;display:flex;justify-content:space-between;align-items:center">📞 ${esc(f.contato)} ${waLink(f.contato)}</div>` : ''}
      </div>`).join('') || `<div class="empty">Nenhuma frente.</div>`;
  }

  // ----- Tarefas -----
  if (evTab === 'tarefas') {
    const fases = FASES.concat([...new Set(e.tarefas.map(x => x.fase))].filter(f => !FASES.includes(f)));
    h += fases.map(f => {
      const list = e.tarefas.filter(x => x.fase === f).sort((a, b) => (a.prazo || '9').localeCompare(b.prazo || '9'));
      if (!list.length) return '';
      return `<div class="fase"><h3>${esc(f)} · ${list.filter(x => x.feito).length}/${list.length}</h3><div class="box">${list.map(x => taskRow(x, e)).join('')}</div></div>`;
    }).join('') || '<div class="empty">Sem tarefas ainda.</div>';
    h += `<p class="hint">Toque numa tarefa para editar ou escolher o responsável.</p><button class="btn primary wide" ${act(() => openTaskForm(e.id))}>+ Nova tarefa</button>`;
  }

  // ----- Equipe -----
  if (evTab === 'equipe') {
    const grupos = {};
    e.equipe.forEach(m => { (grupos[m.funcao || 'Sem função definida'] ||= []).push(m); });
    h += Object.keys(grupos).length ? Object.entries(grupos).sort().map(([f, ms]) => `<div class="section-title">${esc(f)}</div>` + ms.map(m => {
      const tks = e.tarefas.filter(x => x.responsavel === m.nome);
      return `<div class="member">
        <div class="m-head" ${act(() => openMemberForm(e.id, m.id))}>
          <div class="avatar" style="background:${evColor(e)}">${esc(initials(m.nome))}</div>
          <div class="body"><div class="t">${esc(m.nome)}</div><div class="m-role">${esc(m.funcao || 'Sem função')}</div>
          ${m.contato ? `<div class="s">📞 ${esc(m.contato)}</div>` : ''}</div>${waLink(m.contato)}
        </div>
        ${m.responsabilidades ? `<div class="m-resp">${esc(m.responsabilidades)}</div>` : ''}
        ${tks.length ? `<div class="m-tasks"><div class="meta">Tarefas · ${tks.filter(x => x.feito).length}/${tks.length}</div>${tks.map(x => taskRow(x, e)).join('')}</div>` : ''}
      </div>`;
    }).join('')).join('') : `<div class="empty">Cadastre as pessoas da equipe para escolher os responsáveis mais rápido.<br>Toque em <b>+</b> para adicionar.</div>`;
  }
  return h;
}

// ---------- Modal ----------
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
function openSheet(html) { sheet.innerHTML = html; overlay.classList.add('open'); sheet.scrollTop = 0; sheet.querySelectorAll('.close-x').forEach(b => b.onclick = closeSheet); }
function closeSheet() { overlay.classList.remove('open'); }
overlay.onclick = e => { if (e.target === overlay) closeSheet(); };

function teamOptions(evId, sel) {
  const e = evById(evId);
  const nomes = (e && e.equipe || []).map(m => m.nome);
  if (sel && !nomes.includes(sel)) nomes.push(sel);
  return `<option value="">— ninguém ainda —</option>` + nomes.map(n => {
    const m = e && (e.equipe || []).find(x => x.nome === n);
    return `<option value="${esc(n)}" ${n === sel ? 'selected' : ''}>${esc(n)}${m && m.funcao ? ' · ' + esc(m.funcao) : ''}</option>`;
  }).join('');
}

// ---------- Equipe ----------
function openMemberForm(evId, memId) {
  const e = evById(evId);
  e.equipe = e.equipe || [];
  const m = e.equipe.find(x => x.id === memId) || {};
  const isNew = !m.id;
  openSheet(`<h2>${isNew ? 'Adicionar à equipe' : 'Editar pessoa'} <button class="close-x">✕</button></h2>
    <label class="f">Nome *</label>
    <input class="in" id="mNome" placeholder="Ex.: Ana Paula" value="${esc(m.nome)}">
    <label class="f">Função no evento *</label>
    <input class="in" id="mFuncao" list="funcoesList" placeholder="Escolha ou escreva" value="${esc(m.funcao)}">
    <datalist id="funcoesList">${[...new Set([...FUNCOES, ...store.eventos.flatMap(x => (x.equipe || []).map(y => y.funcao))])].filter(Boolean).map(f => `<option value="${esc(f)}">`).join('')}</datalist>
    <label class="f">Contato (WhatsApp)</label>
    <input class="in" id="mContato" type="tel" placeholder="(11) 99999-9999" value="${esc(m.contato)}">
    <label class="f">O que essa pessoa faz</label>
    <textarea class="in" id="mResp" placeholder="Ex.: Fotografar a missa, enviar fotos até 2 dias depois">${esc(m.responsabilidades)}</textarea>
    <div class="btns">
      ${isNew ? '' : '<button class="btn danger" id="mDel">Remover</button>'}
      <button class="btn primary" id="mSave">Salvar</button>
    </div>`);
  const $ = id => document.getElementById(id);
  $('mSave').onclick = () => {
    const nome = $('mNome').value.trim(), funcao = $('mFuncao').value.trim();
    if (!nome || !funcao) { toast('Preencha o nome e a função'); return; }
    if (e.equipe.some(x => x.nome === nome && x.id !== m.id)) { toast('Já existe alguém com esse nome'); return; }
    if (!isNew && m.nome !== nome) {
      e.tarefas.forEach(x => { if (x.responsavel === m.nome) x.responsavel = nome; });
      store.posts.forEach(p => { if (p.eventoId === e.id && p.responsavel === m.nome) p.responsavel = nome; });
    }
    const obj = { id: m.id || uid(), nome, funcao, contato: $('mContato').value.trim(), responsabilidades: $('mResp').value };
    if (isNew) e.equipe.push(obj); else Object.assign(m, obj);
    save(); closeSheet(); render(); toast('Equipe atualizada');
  };
  if (!isNew) $('mDel').onclick = () => {
    if (!confirm(`Remover ${m.nome} da equipe? As tarefas dessa pessoa ficarão sem responsável.`)) return;
    e.equipe = e.equipe.filter(x => x.id !== m.id);
    e.tarefas.forEach(x => { if (x.responsavel === m.nome) x.responsavel = ''; });
    save(); closeSheet(); render();
  };
}

function openTaskForm(evId, taskId) {
  const e = evById(evId);

  openSheet(`<h2>${isNew ? 'Nova tarefa' : 'Editar tarefa'} <button class="close-x">✕</button></h2>
    <div class="s" style="color:${evColor(e)};font-weight:600;margin-top:-6px">📁 ${esc(e.nome)}</div>

    <div class="row2">

      <div><label class="f">Prazo</label><input class="in" type="date" id="tPrazo" value="${esc(x.prazo)}"></div>
    </div>
    <label class="f">Responsável</label>

    ${isNew ? '' : `<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px"><input type="checkbox" id="tFeito" ${x.feito ? 'checked' : ''} style="width:18px;height:18px"> Concluída</label>`}
    <div class="btns">
      ${isNew ? '' : '<button class="btn danger" id="tDel">Excluir</button>'}

// ---------- Event form ----------
function openEventForm(e = {}) {
  const isNew = !e.id;
  let cor = e.id ? evColor(e) : CORES_EV[store.eventos.length % CORES_EV.length];
  openSheet(`<h2>${isNew ? 'Nova pasta de evento' : 'Editar evento'} <button class="close-x">✕</button></h2>
    <label class="f">Nome do evento / campanha *</label>
    <input class="in" id="eNome" placeholder="Ex.: Missa dos 30 anos" value="${esc(e.nome)}">
    <div class="row2">
      <div><label class="f">Data *</label><input class="in" type="date" id="eData" value="${esc(e.data || addDays(today(), 30))}"></div>
      <div><label class="f">Horário</label>${timePick('eHora', e.hora)}</div>
    </div>
    <label class="f">Cor da pasta (aparece no calendário)</label>
    <div class="swatches">${CORES_EV.map(c => `<button type="button" class="sw ${c === cor ? 'on' : ''}" data-cor="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('')}</div>
    <label class="f">Local</label>
    <input class="in" id="eLocal" placeholder="Endereço ou online" value="${esc(e.local)}">
    <label class="f">Objetivo</label>
    <input class="in" id="eObjetivo" placeholder="Ex.: 200 inscritos, igreja cheia" value="${esc(e.objetivo)}">
    <label class="f">Público-alvo</label>
    <input class="in" id="ePublico" placeholder="Quem queremos alcançar" value="${esc(e.publico)}">
    <div class="row2">
      <div><label class="f">Orçamento (R$)</label><input class="in" type="number" min="0" step="0.01" id="eOrcamento" value="${esc(e.orcamento)}"></div>
      <div><label class="f">Status</label><select class="in" id="eStatus">${opts(STATUS_EV, e.status || 'Planejando')}</select></div>
    </div>
    <label class="f">Notas</label>
    <textarea class="in" id="eNotas" style="min-height:60px">${esc(e.notas)}</textarea>
    ${isNew ? `<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px"><input type="checkbox" id="eModelo" checked style="width:18px;height:18px"> Criar checklist padrão de organização</label>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13px"><input type="checkbox" id="ePosts" style="width:18px;height:18px"> Gerar cronograma de posts de divulgação</label>` : ''}
    <div class="btns">
      ${isNew ? '' : '<button class="btn danger" id="eDel">Excluir</button>'}
      <button class="btn primary" id="eSave">Salvar</button>
    </div>`);
  const $ = id => document.getElementById(id);
  sheet.querySelectorAll('[data-cor]').forEach(b => b.onclick = () => {
    cor = b.dataset.cor; sheet.querySelectorAll('[data-cor]').forEach(x => x.classList.toggle('on', x === b));
  });
  $('eSave').onclick = () => {
    const nome = $('eNome').value.trim();
    const data = $('eData').value;
    if (!nome || !data) { toast('Preencha o nome e a data'); return; }
    const obj = {
      nome, data, hora: readTime('eHora'), cor, local: $('eLocal').value.trim(), objetivo: $('eObjetivo').value.trim(),
      publico: $('ePublico').value.trim(), orcamento: $('eOrcamento').value, status: $('eStatus').value, notas: $('eNotas').value,
    };
    let id = e.id;
    if (isNew) {
      id = uid();
      const tarefas = $('eModelo').checked ? MODELO_TAREFAS.map(([fase, texto, off]) => ({ id: uid(), fase, texto, prazo: addDays(data, off), responsavel: '', feito: false })) : [];
      store.eventos.push({ id, ...obj, tarefas, equipe: [] });
      ensureAreas(evById(id));
      if ($('ePosts').checked) gerarPosts(id);
    } else {
      const ev = evById(id);
      const delta = Math.round((parse(data) - parse(ev.data)) / 86400000);
      if (delta && confirm('A data mudou. Mover também os prazos das tarefas e os posts ligados a este evento?')) {
        (ev.tarefas || []).forEach(t => { if (t.prazo) t.prazo = addDays(t.prazo, delta); });
        store.posts.forEach(p => { if (p.eventoId === id && p.status !== 'Publicado') p.data = addDays(p.data, delta); });
      }
      Object.assign(ev, obj);
    }
    save(); openFolder(id, isNew ? 'geral' : evTab); toast('Evento salvo');
  };
  if (!isNew) {
    $('eDel').onclick = () => {
      const n = store.posts.filter(p => p.eventoId === e.id).length;
      if (!confirm(`Excluir a pasta "${e.nome}"?${n ? `\nOs ${n} posts ligados a ela serão mantidos, sem vínculo.` : ''}`)) return;
      store.eventos = store.eventos.filter(x => x.id !== e.id);
      store.posts.forEach(p => { if (p.eventoId === e.id) p.eventoId = ''; });
      openEvId = null;
      save(); closeSheet(); render(); toast('Evento excluído');
    };
  }
}

function gerarPosts(evId) {
  const e = evById(evId);
  let n = 0;
  MODELO_POSTS.forEach(([off, titulo, rede, formato]) => {
    const data = addDays(e.data, off);
    if (store.posts.some(p => p.eventoId === evId && p.titulo === titulo && p.data === data)) return;
    store.posts.push({ id: uid(), titulo, data, hora: '', rede, formato, status: 'Ideia', eventoId: evId, responsavel: '', legenda: '', hashtags: '', objetivo: '', notas: '' });
    n++;
  });
  return n;
}

// ---------- Backup ----------
document.getElementById('btnBackup').onclick = () => {
  openSheet(`<h2>Backup dos dados <button class="close-x">✕</button></h2>
    <p style="font-size:13px;color:var(--text-3);margin-top:0">Os dados ficam salvos neste aparelho. Exporte um arquivo para guardar ou passar para outro celular.</p>
    <div class="btns"><button class="btn primary" id="bExp">Exportar</button><button class="btn" id="bImp">Importar</button></div>
    <div class="btns"><button class="btn" id="bTxt">Copiar cronograma em texto</button></div>`);
  document.getElementById('bExp').onclick = () => {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `marketing-backup-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  document.getElementById('bImp').onclick = () => document.getElementById('importFile').click();
  document.getElementById('bTxt').onclick = () => {
    const linhas = store.posts.filter(p => p.data >= today()).sort(byDate)
      .map(p => `${parse(p.data).getDate()}/${pad(parse(p.data).getMonth() + 1)}${p.hora ? ' ' + p.hora : ''} · ${p.rede} ${p.formato} · ${p.titulo} [${p.status}]`);
    const txt = '📅 Cronograma de postagens\n\n' + (linhas.join('\n') || 'Nenhum post futuro.');
    navigator.clipboard?.writeText(txt).then(() => toast('Cronograma copiado'), () => toast('Não foi possível copiar'));
  };
};
document.getElementById('importFile').onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if (!Array.isArray(d.posts) || !Array.isArray(d.eventos)) throw new Error();
    if (!confirm('Substituir os dados atuais pelos do arquivo?')) return;
    store = d; save(); closeSheet(); render(); toast('Dados importados');
  }).catch(() => toast('Arquivo inválido'));
  ev.target.value = '';
};

// ---------- Dark mode ----------
function setDark(on) { document.body.classList.toggle('dark', on); try { localStorage.setItem(DARK_KEY, on ? '1' : '0'); } catch (e) {} }
document.getElementById('btnDark').onclick = () => setDark(!document.body.classList.contains('dark'));
try { setDark(localStorage.getItem(DARK_KEY) === '1'); } catch (e) {}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
</body>
</html>
