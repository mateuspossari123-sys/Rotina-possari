<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;font-family:Roboto,sans-serif}
section{width:1080px;height:1920px;position:relative;overflow:hidden;background:#0b141a;color:#e9edef}
.wall{position:absolute;inset:0;opacity:.06;background-image:radial-gradient(circle at 20% 30%,#fff 2px,transparent 3px),radial-gradient(circle at 70% 60%,#fff 2px,transparent 3px),radial-gradient(circle at 45% 85%,#fff 1.5px,transparent 2.5px);background-size:120px 120px,160px 160px,90px 90px}
.status{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;font-size:38px;font-weight:500;background:#0b141a;position:relative;z-index:2}
.top{height:150px;background:#0b141a;display:flex;align-items:center;padding:0 30px;gap:22px;position:relative;z-index:2;border-bottom:1px solid #1f2c34}
.top img{width:96px;height:96px;border-radius:50%;object-fit:cover}
.name{font-size:44px;font-weight:500;flex:1}
.name small{display:block;font-size:28px;color:#8696a0;font-weight:400;margin-top:4px}
.ic{width:56px;height:56px;margin-left:26px}
.chat{position:absolute;left:0;right:0;top:242px;bottom:150px;padding:30px 34px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;z-index:1}
.day{align-self:center;background:#182229;color:#8696a0;font-size:28px;padding:10px 26px;border-radius:14px;margin-bottom:26px}
.b{max-width:800px;font-size:41px;line-height:1.32;padding:18px 26px 14px;border-radius:22px;position:relative}
.b .m{font-size:26px;color:rgba(233,237,239,.6);float:right;margin:18px 0 -6px 26px;display:flex;align-items:center;gap:6px}
.out{align-self:flex-end;background:#005c4b;border-top-right-radius:6px}
.in{align-self:flex-start;background:#202c33;border-top-left-radius:6px}
.tick{width:38px;height:22px}
.st{align-self:flex-start;position:relative;margin-top:6px}
.st img{width:330px;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.st .m{position:absolute;right:6px;bottom:6px;background:rgba(11,20,26,.7);font-size:26px;color:#e9edef;padding:4px 14px;border-radius:12px}
.bar{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;gap:20px;padding:0 26px;z-index:2}
.inp{flex:1;height:104px;border-radius:52px;background:#202c33;display:flex;align-items:center;padding:0 34px;color:#8696a0;font-size:40px;gap:26px}
.mic{width:110px;height:110px;border-radius:50%;background:#21c063;display:flex;align-items:center;justify-content:center}
b.g{color:#ffd279;font-weight:500}
</style></head><body><section>

</div>

</section></body></html>
