/* ============ RENDER ============ */
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  document.getElementById('tab-rotina').classList.toggle('active', state.tab==='rotina');
  document.getElementById('tab-calendario').classList.toggle('active', state.tab==='calendario');
  document.getElementById('tab-oracao').classList.toggle('active', state.tab==='oracao');
  document.getElementById('nav-rotina').classList.toggle('active', state.tab==='rotina');
  document.getElementById('nav-calendario').classList.toggle('active', state.tab==='calendario');
  document.getElementById('nav-oracao').classList.toggle('active', state.tab==='oracao');

  if (state.tab === 'rotina') renderRotina();
  if (state.tab === 'calendario') renderCalendario();
  if (state.tab === 'oracao') renderOracao();
}

function renderRotina() {
  const week = getWeekDates(state.selectedDate);
  const strip = week.map(d => {
    const key = dateKey(d);
    const active = key === state.selectedDate;
    return `<div class="week-day ${active?'active':''}" onclick="selectDay('${key}')">
      <div class="wd-label">${WEEKDAY_LABELS[d.getDay()]}</div>
      <div class="wd-date">${d.getDate()}</div>
    </div>`;
  }).join('');
  document.getElementById('week-strip').innerHTML = strip;

  const items = store.weekAgenda[state.selectedDate] || [];
  if (items.length === 0) {
    document.getElementById('timeline').innerHTML = '';
    document.getElementById('timeline-empty').innerHTML = '<div class="tl-empty">Nada agendado para este dia ainda.</div>';
  } else {
    document.getElementById('timeline-empty').innerHTML = '';
    document.getElementById('timeline').innerHTML = items.map((ev, idx) => `
      <div class="tl-row">
        <div class="tl-time-col"><div class="tl-time">${esc(ev.time)}</div><div class="tl-line"></div></div>
        <div class="tl-card-wrap">
          <div class="tl-card">
            <div class="tl-label">${esc(ev.label)}</div>
            <div class="tl-person">${esc(ev.person)}</div>
            <div class="tl-del" onclick="deleteTimelineItem('${state.selectedDate}', ${idx})">✕</div>
          </div>
        </div>
      </div>`).join('');
  }

  if (state.isAddingTimeline) {
    document.getElementById('timeline-form-wrap').innerHTML = `
      <div class="inline-form">
        <input class="f-time" placeholder="19:00" value="${esc(state.draftTime)}" oninput="onDraftTimeInput(this.value)" />
        <input class="f-label" placeholder="Compromisso..." value="${esc(state.draftLabel)}" oninput="onDraftLabelInput(this.value)" onkeydown="onTimelineKey(event)" autofocus />
        <div class="f-ok" onclick="confirmTimeline()">OK</div>
      </div>`;
  } else {
    document.getElementById('timeline-form-wrap').innerHTML = `
      <div class="dashed-btn" onclick="startAddTimeline()"><span class="plus">+</span> Adicionar a este dia</div>`;
  }

  document.getElementById('cat-pills').innerHTML = ROTINA_CATEGORIES.map(c => `
    <div class="cat-pill ${c.id===state.rotinaCategory?'active':''}" onclick="setRotinaCategory('${c.id}')">${c.label}</div>
  `).join('');

  const allItems = [...(ROTINA_DATA[state.rotinaCategory]||[]), ...(store.customItems[state.rotinaCategory]||[])];
  const periodOrder = ['Manhã','Tarde','Noite','Geral'];
  const grouped = {};
  allItems.forEach(it => { (grouped[it.period] = grouped[it.period]||[]).push(it); });
  const total = allItems.length;
  const done = allItems.filter(it => store.checks[it.id]).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  let html = `
    <div class="progress-row"><div class="progress-label">${done} de ${total} concluídas</div><div class="progress-pct">${pct}%</div></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>`;

  periodOrder.filter(p => grouped[p]).forEach(p => {
    html += `<div class="period-group"><div class="period-title">${p}</div><div class="item-list">`;
    grouped[p].forEach(it => {
      const checked = !!store.checks[it.id];
      const isCustom = it.id.startsWith('custom-');
      html += `
        <div class="check-item">
          <div class="check-box ${checked?'checked':''}" onclick="toggleCheck('${it.id}')">${checked?'<div class="mark">✓</div>':''}</div>
          <div class="check-text ${checked?'done':''}">${esc(it.text)}</div>
          <div class="check-person">${esc(it.person)}</div>
          ${isCustom?`<button class="check-del" onclick="deleteCustomItem('${state.rotinaCategory}','${it.id}')">✕</button>`:''}
        </div>`;
    });
    html += `</div></div>`;
  });

  if (state.addingFor === state.rotinaCategory) {
    html += `
      <div class="inline-form">
        <input class="f-label" placeholder="Nova atividade..." value="${esc(state.draftText)}" oninput="onDraftItemInput(this.value)" onkeydown="onDraftItemKey(event)" autofocus />
        <div class="f-ok" onclick="confirmAddItem()">OK</div>
      </div>`;
  } else {
    html += `<div class="dashed-btn" onclick="startAddItem('${state.rotinaCategory}')"><span class="plus">+</span> Nova atividade</div>`;
  }

  document.getElementById('checklist').innerHTML = html;
}

function renderCalendario() {
  const y = state.calYear, m = state.calMonth;
  document.getElementById('cal-month').textContent = MONTH_LABELS[m] + ' ' + y;

  const firstDay = new Date(y, m, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayKey = dateKey(new Date());

  let cells = '';
  for (let i=0;i<startOffset;i++) cells += `<div class="cal-day" style="visibility:hidden;"></div>`;
  for (let d=1; d<=daysInMonth; d++) {
    const key = dateKey(new Date(y,m,d));
    const isToday = key === todayKey;
    const hasEvent = (store.calEvents[key]||[]).length > 0;
    cells += `<div class="cal-day ${isToday?'today':''}" onclick="jumpToDayInRotina('${key}')">
      <div>${d}</div>${hasEvent?'<div class="dot"></div>':''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML = cells;

  const upcoming = [];
  Object.keys(store.calEvents).sort().forEach(key => {
    if (key < todayKey) return;
    (store.calEvents[key]||[]).forEach((ev, idx) => upcoming.push({ key, idx, ...ev }));
  });
  upcoming.sort((a,b)=>a.key.localeCompare(b.key));

  if (upcoming.length === 0) {
    document.getElementById('upcoming-list').innerHTML = `<div class="tl-empty">Nenhum evento futuro cadastrado.</div>`;
  } else {
    document.getElementById('upcoming-list').innerHTML = upcoming.slice(0,8).map(ev => {
      const [yy,mm,dd] = ev.key.split('-');
      return `<div class="upcoming-item">
        <div class="dot"></div>
        <div style="flex:1;">
          <div class="u-label">${esc(ev.label)}</div>
          <div class="u-date">${dd}/${mm} · ${esc(ev.person)}</div>
        </div>
        <button class="u-del" onclick="deleteCalEvent('${ev.key}', ${ev.idx})">✕</button>
      </div>`;
    }).join('');
  }

  if (state.isAddingCalEvent) {
    document.getElementById('cal-add-wrap').innerHTML = `
      <div class="inline-form">
        <input type="date" class="f-time" style="width:130px;" value="${esc(state.draftCalDate)}" oninput="onCalDateInput(this.value)" />
        <input class="f-label" placeholder="Nome do evento..." value="${esc(state.draftCalLabel)}" oninput="onCalLabelInput(this.value)" />
        <div class="f-ok" onclick="confirmCalEvent()">OK</div>
      </div>`;
  } else {
    document.getElementById('cal-add-wrap').innerHTML = `<div class="dashed-btn" onclick="startAddCalEvent()"><span class="plus">+</span> Adicionar evento</div>`;
  }
}

function jumpToDayInRotina(key) {
  state.selectedDate = key;
  setTab('rotina');
}

function renderOracao() {
  const el = document.getElementById('oracao-content');
  const v = state.oracaoView;

  if (v === 'home') {
    const cards = [
      { id:'misterios', glyph:'✥', title:'Terço', subtitle:'Mistérios gozosos, dolorosos, gloriosos e luminosos', view:'misterios' },
      { id:'misericordia', glyph:'♱', title:'Terço da Divina Misericórdia', subtitle:'Revelado a Santa Faustina', view:'misericordia' },
      { id:'exame', glyph:'✎', title:'Exame de Consciência', subtitle:'6 pontos para revisar o dia', view:'exame' },
      { id:'novena', glyph:'✧', title:'Quaresma de São Miguel', subtitle:'15 de agosto a 29 de setembro', view:'novena' },
      { id:'novenas', glyph:'🕊', title:'Novenas', subtitle:'Espírito Santo, São José, Natal e mais', view:'novenas' },
      { id:'diversas', glyph:'🕯', title:'Orações Diversas', subtitle:'Missionário SIM, Estudos, Abandono e mais', view:'diversas' },
    ];
    el.innerHTML = cards.map(c => `
      <div class="oracao-card" onclick="goOracao('${c.view}')">
        <div class="o-glyph">${c.glyph}</div>
        <div style="flex:1;"><div class="o-title">${c.title}</div><div class="o-subtitle">${c.subtitle}</div></div>
        <div class="o-chevron">›</div>
      </div>`).join('');
    return;
  }

  let inner = `<div class="back-link" onclick="backToOracaoHome()"><span style="font-size:16px;">‹</span> Voltar</div>`;

  if (v === 'misterios') {
    inner += `<div class="oracao-h1">Mistérios do Terço</div><div style="margin-top:14px;">`;
    inner += Object.keys(MISTERIOS).map(key => `
      <div class="mist-item" onclick="goOracao('misterioDetail', {misterioType:'${key}'})">
        <div class="m-title">${MISTERIOS[key].title}</div>
        <div class="m-days">${MISTERIOS[key].days}</div>
      </div>`).join('');
    inner += `</div>`;
  }
  else if (v === 'misterioDetail') {
    const mt = MISTERIOS[state.misterioType];
    inner += `<div class="oracao-h1">${mt.title}</div><div class="oracao-sub">${mt.days}</div>`;
    inner += mt.list.map((text,i) => `
      <div class="mist-step"><div class="m-n">${i+1}</div><div class="m-text">${text}</div></div>`).join('');
  }
  else if (v === 'misericordia') {
    inner += `
      <div class="oracao-h1">Terço da Divina Misericórdia</div>
      <div class="oracao-sub italic">Revelado a Santa Faustina · usar um terço normal</div>
      <div class="prayer-block"><div class="p-label">Início</div><div class="p-text">Sinal da Cruz, Pai Nosso, Ave Maria, Credo.</div></div>
      <div class="prayer-block"><div class="p-label">Nas contas grandes (Pai Nosso)</div><div class="p-text">Eterno Pai, eu Vos ofereço o Corpo e Sangue, Alma e Divindade do vosso muito amado Filho, Nosso Senhor Jesus Cristo, em expiação dos nossos pecados e dos pecados de todo o mundo.</div></div>
      <div class="prayer-block"><div class="p-label">Nas contas pequenas (Ave Maria)</div><div class="p-text">Pela Sua dolorosa Paixão, tende misericórdia de nós e de todo o mundo.</div></div>
      <div class="prayer-block"><div class="p-label">Ao final (3 vezes)</div><div class="p-text">Deus Santo, Deus Forte, Deus Imortal, tende piedade de nós e de todo o mundo.</div></div>
      <div class="prayer-block navy"><div class="p-label">Oração final</div><div class="p-text">Ó Eterno Deus, cuja Misericórdia é infinita e cujo tesouro de compaixão não tem limites, olhai-nos propício e aumentai a vossa misericórdia para connosco, para que nos momentos difíceis não desesperemos, nem desanimemos, mas com grande confiança nos conformemos à vossa santa vontade, que é o Amor e a própria Misericórdia. Amém.</div></div>
      <div class="prayer-center">✦ Jesus, eu confio em Vós ✦</div>`;
  }
  else if (v === 'exame') {
    inner += `
      <div class="oracao-h1">Exame de Consciência</div>
      <div class="oracao-body">Reserve 10 minutos ao fim do dia. Coloque-se na presença de Deus e percorra cada ponto com calma, sem ansiedade, confiando no amor de Deus.</div>`;
    EXAME_SECTIONS.forEach(sec => {
      const open = state.exameOpen === sec.id;
      inner += `
        <div class="accordion">
          <div class="accordion-head" onclick="toggleExame('${sec.id}')">
            <div><div class="a-title">${sec.title}</div><div class="a-subtitle">${sec.subtitle}</div></div>
            <div class="a-chevron">${open?'−':'+'}</div>
          </div>
          ${open?`<div class="accordion-body">${sec.questions.map((q,i)=>`<div class="accordion-q"><div class="q-n">${i+1}</div><div>${q}</div></div>`).join('')}</div>`:''}
        </div>`;
    });
    inner += `<div class="prayer-block navy" style="margin-top:16px;"><div class="p-label">Ato de Contrição</div><div class="p-text">Meu Deus, eu me arrependo de coração de todos os meus pecados, porque pecando ofendi a Vós, que sois infinitamente bom, e prometo com o vosso auxílio não vos ofender mais. Tende misericórdia de mim, pecador. Amém.</div></div>`;
  }
  else if (v === 'diversas') {
    inner += `<div class="oracao-h1">Orações Diversas</div><div class="novena-intro">Orações avulsas para diferentes momentos e intenções.</div>`;
    inner += DIVERSAS.map(p => `
      <div class="novena-item" onclick="goOracao('diversaDetail', {diversaId:'${p.id}'})">
        <div class="n-icon">${p.icon}</div>
        <div style="flex:1;"><div class="n-title">${p.title}</div><div class="n-sub">${p.sub}</div></div>
        <div class="o-chevron">›</div>
      </div>`).join('');
  }
  else if (v === 'diversaDetail') {
    const p = DIVERSAS.find(x => x.id === state.diversaId);
    inner += `
      <div class="oracao-h1">${p.icon} ${p.title}</div>
      <div class="oracao-sub italic">${p.sub}</div>
      <div class="prayer-block" style="margin-top:14px;"><div class="p-text">${esc(p.body).replace(/\n/g,'<br>')}</div></div>`;
  }
  else if (v === 'novenas') {
    inner += `<div class="oracao-h1">Novenas</div><div class="novena-intro">Nove dias de oração preparando-se para uma festa ou intenção especial.</div>`;
    inner += NOVENAS.map(n => `
      <div class="novena-item" onclick="goOracao('novenaDetail', {novenaId:'${n.id}', novenaDay:0})">
        <div class="n-icon">${n.icon}</div>
        <div style="flex:1;"><div class="n-title">${n.title}</div><div class="n-sub">${n.sub}</div></div>
        <div class="o-chevron">›</div>
      </div>`).join('');
  }
  else if (v === 'novenaDetail') {
    const n = NOVENAS.find(x => x.id === state.novenaId);
    const day = n.days[state.novenaDay];
    inner += `
      <div class="oracao-h1">${n.icon} ${n.title}</div>
      <div class="novena-intro">${n.intro}</div>
      <div class="novena-day-tabs">
        ${n.days.map((d,i) => `<div class="novena-day-btn ${i===state.novenaDay?'active':''}" onclick="setNovenaDay(${i})">${i+1}</div>`).join('')}
      </div>
      <div class="novena-text-card">
        <div class="novena-text-title">${day.title}</div>
        <div class="novena-text-body">${day.oracao.replace(/\n/g,'<br>')}</div>
      </div>`;
  }
  else if (v === 'novena') {
    inner += `
      <div class="oracao-h1">Quaresma de São Miguel</div>
      <div class="oracao-sub italic">15 de agosto a 29 de setembro</div>
      <div class="oracao-body">Devoção iniciada por São Francisco de Assis, preparando-se para grandes festas com 40 dias de penitência e oração — da Assunção (15/08) aos Santos Arcanjos (29/09).</div>
      <div class="prayer-block navy"><div class="p-label">Oração inicial · todos os dias</div><div class="p-text">São Miguel Arcanjo, defendei-nos no combate, sede o nosso refúgio contra as maldades e ciladas do demônio. Ordene-lhe Deus, instantemente o pedimos. E vós, príncipe da milícia celeste, precipitai ao inferno Satanás e os outros espíritos malignos que andam pelo mundo para perder as almas. Amém.</div></div>
      <div class="accordion">
        <div class="accordion-head" onclick="toggleLadainha()">
          <div class="a-title">Ladainha de São Miguel</div><div class="a-chevron">${state.ladainhaOpen?'−':'+'}</div>
        </div>
        ${state.ladainhaOpen?`<div class="accordion-simple-body">Senhor, tende piedade de nós. Jesus Cristo, tende piedade de nós. Santa Maria, Rainha dos Anjos, rogai por nós. São Miguel, rogai por nós; cheio da graça de Deus; perfeito adorador do Verbo Divino; príncipe dos exércitos do Senhor; guardião do Paraíso; luz dos anjos; baluarte dos cristãos; nosso auxílio em todas as adversidades; consolador das almas do Purgatório; nosso advogado, rogai por nós. Oremos: Senhor Jesus, santificai-nos por uma bênção sempre nova e concedei-nos, pela intercessão de São Miguel, a sabedoria que nos ensina a ajuntar riquezas do céu. Amém.</div>`:''}
      </div>
      <div class="accordion">
        <div class="accordion-head" onclick="toggleConsagracao()">
          <div class="a-title">Consagração a São Miguel</div><div class="a-chevron">${state.consagracaoOpen?'−':'+'}</div>
        </div>
        ${state.consagracaoOpen?`<div class="accordion-simple-body">Ó Príncipe nobilíssimo dos Anjos, valoroso guerreiro do Altíssimo, a vós hoje me consagro, me dou e ofereço, e ponho-me a mim, à minha família e a tudo o que me pertence debaixo da vossa poderosíssima proteção. Defendei-me dos inimigos da alma, especialmente na hora da morte. São Miguel Arcanjo, defendei-nos no combate para que não pereçamos no supremo juízo. Amém.</div>`:''}
      </div>`;
  }

  el.innerHTML = inner;
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
