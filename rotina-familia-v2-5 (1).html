<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ora et Labora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#223361">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ora et Labora">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: oklch(0.965 0.006 75); font-family: 'Work Sans', sans-serif; }
  ::-webkit-scrollbar { display: none; }

  .page {
    min-height: 100vh; width: 100%; display: flex; justify-content: center;
    align-items: flex-start; padding: 32px 16px; background: oklch(0.965 0.006 75);
  }
  .card {
    width: 402px; max-width: 100%; min-height: 840px;
    background: oklch(0.995 0.004 75); border-radius: 28px;
    box-shadow: 0 24px 60px -20px oklch(0.3 0.02 40 / 0.35);
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }

  /* HEADER */
  .header {
    padding: 28px 24px 20px; text-align: center; position: relative;
    background: oklch(0.26 0.06 255);
  }
  .header .glyph { font-family:'Source Serif 4',serif; font-size:15px; letter-spacing:.3em; color:oklch(0.74 0.11 85); margin:0 0 6px; }
  .header .title { font-family:'Source Serif 4',serif; font-weight:600; font-size:26px; color:oklch(0.82 0.09 85); letter-spacing:.01em; }
  .header .subtitle { font-family:'Source Serif 4',serif; font-style:italic; font-size:12.5px; color:oklch(0.68 0.07 85); margin-top:5px; letter-spacing:.02em; }
  .header .rule { width:36px; height:2px; background:oklch(0.74 0.11 85); margin:14px auto 0; border-radius:2px; }

  /* CONTENT */
  .content { flex:1; overflow-y:auto; padding:4px 20px 108px; }
  .tab-view { display:none; }
  .tab-view.active { display:block; }

  .section-label { font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.6 0.03 40); margin:16px 0 10px; }

  /* WEEK STRIP */
  .week-strip { display:flex; gap:6px; margin-bottom:18px; }
  .week-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 0; border-radius:12px; cursor:pointer; border:1px solid oklch(0.91 0.01 60); background:oklch(0.98 0.004 75); }
  .week-day .wd-label { font-size:10px; font-weight:600; letter-spacing:.04em; color:oklch(0.4 0.02 40); }
  .week-day .wd-date { font-size:13px; font-weight:600; color:oklch(0.4 0.02 40); }
  .week-day.active { background:oklch(0.26 0.06 255); border-color:oklch(0.26 0.06 255); }
  .week-day.active .wd-label, .week-day.active .wd-date { color:oklch(0.82 0.09 85); }

  /* TIMELINE */
  .timeline { display:flex; flex-direction:column; margin-bottom:14px; }
  .tl-row { display:flex; gap:14px; }
  .tl-time-col { display:flex; flex-direction:column; align-items:center; width:44px; flex:0 0 auto; }
  .tl-time { font-size:12px; font-weight:600; color:oklch(0.26 0.06 255); padding-top:8px; }
  .tl-line { width:1px; flex:1; background:oklch(0.88 0.01 60); margin-top:6px; }
  .tl-card-wrap { flex:1; padding:8px 14px 20px; margin-top:2px; }
  .tl-card { padding:11px 14px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:8px; position:relative; }
  .tl-card .tl-label { font-size:13.5px; color:oklch(0.25 0.02 40); font-weight:500; }
  .tl-card .tl-person { font-size:10.5px; font-weight:600; color:oklch(0.55 0.03 40); background:oklch(0.94 0.015 60); padding:3px 8px; border-radius:8px; flex:0 0 auto; }
  .tl-del { position:absolute; right:6px; top:-8px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); color:oklch(0.6 0.03 40); cursor:pointer; font-size:10px; padding:1px 5px; border-radius:8px; }
  .tl-empty { font-size:12.5px; color:oklch(0.6 0.03 40); text-align:center; padding:6px 0 14px; }

  .dashed-btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:13px; border:1.5px dashed oklch(0.8 0.02 60); border-radius:14px; color:oklch(0.5 0.03 40); font-size:13.5px; font-weight:500; cursor:pointer; margin-bottom:20px; }
  .dashed-btn .plus { font-size:16px; line-height:1; }

  .inline-form { display:flex; gap:8px; margin-bottom:20px; }
  .inline-form input { font-family:'Work Sans',sans-serif; font-size:13.5px; outline:none; border-radius:12px; border:1px solid oklch(0.85 0.01 60); padding:11px 14px; }
  .inline-form .f-time { width:70px; text-align:center; padding:11px 10px; }
  .inline-form .f-label { flex:1; }
  .inline-form .f-ok { padding:11px 16px; background:oklch(0.26 0.06 255); color:oklch(0.78 0.1 85); border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; }

  /* CATEGORY PILLS */
  .cat-pills { display:flex; gap:8px; margin-bottom:16px; }
  .cat-pill { flex:0 0 auto; padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; border:1px solid oklch(0.9 0.01 60); background:oklch(0.98 0.004 75); font-size:13px; font-weight:500; color:oklch(0.5 0.03 40); }
  .cat-pill.active { background:oklch(0.93 0.015 255); border-color:oklch(0.26 0.06 255); color:oklch(0.26 0.06 255); }

  /* CHECKLIST */
  .progress-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .progress-label { font-size:12.5px; color:oklch(0.5 0.02 40); font-weight:500; }
  .progress-pct { font-size:12.5px; color:oklch(0.26 0.06 255); font-weight:600; }
  .progress-track { width:100%; height:6px; background:oklch(0.92 0.01 60); border-radius:4px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { height:100%; background:oklch(0.26 0.06 255); border-radius:4px; transition:width .25s; }
  .period-group { margin-bottom:20px; }
  .period-title { font-size:11.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:oklch(0.6 0.03 40); margin-bottom:8px; }
  .item-list { display:flex; flex-direction:column; gap:8px; }
  .check-item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:14px; }
  .check-box { width:22px; height:22px; flex:0 0 auto; border-radius:7px; border:1.5px solid oklch(0.26 0.06 255); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .check-box.checked { background:oklch(0.26 0.06 255); }
  .check-box .mark { color:oklch(0.78 0.1 85); font-size:13px; font-weight:700; }
  .check-text { flex:1; font-size:14px; color:oklch(0.25 0.02 40); }
  .check-text.done { color:oklch(0.6 0.02 40); text-decoration:line-through; }
  .check-person { font-size:10.5px; font-weight:600; color:oklch(0.55 0.03 40); background:oklch(0.94 0.015 60); padding:3px 8px; border-radius:8px; }
  .check-del { background:none; border:none; color:oklch(0.7 0.02 40); cursor:pointer; font-size:12px; padding:2px 4px; }

  /* CALENDARIO */
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin:16px 0 16px; }
  .cal-month { font-size:16px; font-weight:600; font-family:'Source Serif 4',serif; color:oklch(0.22 0.02 40); text-transform:capitalize; }
  .cal-nav { display:flex; gap:6px; color:oklch(0.5 0.02 40); font-size:15px; }
  .cal-nav span { cursor:pointer; padding:4px 8px; }
  .cal-weekdays, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-weekdays { margin-bottom:6px; }
  .cal-weekdays div { text-align:center; font-size:10.5px; font-weight:600; color:oklch(0.6 0.02 40); padding:4px 0; }
  .cal-grid { margin-bottom:24px; }
  .cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; font-size:12.5px; cursor:pointer; color:oklch(0.3 0.02 40); font-weight:500; background:transparent; }
  .cal-day.today { background:oklch(0.26 0.06 255); color:oklch(0.995 0.004 75); font-weight:700; }
  .cal-day .dot { width:4px; height:4px; border-radius:50%; background:oklch(0.72 0.1 85); margin-top:2px; }
  .cal-day.today .dot { background:oklch(0.78 0.1 85); }
  .upcoming-item { display:flex; align-items:center; gap:12px; padding:13px 14px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:14px; margin-bottom:10px; position:relative; }
  .upcoming-item .dot { width:8px; height:8px; border-radius:50%; background:oklch(0.26 0.06 255); flex:0 0 auto; }
  .upcoming-item .u-label { font-size:13.5px; color:oklch(0.22 0.02 40); font-weight:500; }
  .upcoming-item .u-date { font-size:11.5px; color:oklch(0.55 0.03 40); margin-top:2px; }
  .upcoming-item .u-del { position:absolute; right:10px; top:10px; background:none; border:none; color:oklch(0.65 0.02 40); cursor:pointer; font-size:11px; }

  /* ORACAO */
  .oracao-card { display:flex; align-items:center; gap:14px; padding:16px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:16px; cursor:pointer; margin-bottom:10px; }
  .oracao-card .o-glyph { width:38px; height:38px; border-radius:50%; background:oklch(0.26 0.06 255); display:flex; align-items:center; justify-content:center; color:oklch(0.78 0.1 85); font-family:'Source Serif 4',serif; font-size:17px; flex:0 0 auto; }
  .oracao-card .o-title { font-size:14.5px; font-weight:600; color:oklch(0.22 0.02 40); font-family:'Source Serif 4',serif; }
  .oracao-card .o-subtitle { font-size:12px; color:oklch(0.55 0.03 40); margin-top:2px; }
  .oracao-card .o-chevron { color:oklch(0.65 0.02 40); font-size:15px; }

  .back-link { display:flex; align-items:center; gap:6px; color:oklch(0.26 0.06 255); font-size:13px; font-weight:600; cursor:pointer; margin:10px 0 16px; }
  .oracao-h1 { font-family:'Source Serif 4',serif; font-size:19px; font-weight:600; color:oklch(0.22 0.02 40); margin-bottom:2px; }
  .oracao-sub { font-size:12.5px; color:oklch(0.55 0.03 40); margin-bottom:16px; }
  .oracao-sub.italic { font-style:italic; }
  .oracao-body { font-size:13.5px; color:oklch(0.3 0.02 40); line-height:1.6; margin-bottom:16px; }

  .mist-item { padding:15px 16px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:14px; cursor:pointer; margin-bottom:10px; }
  .mist-item .m-title { font-size:14px; font-weight:600; color:oklch(0.22 0.02 40); font-family:'Source Serif 4',serif; }
  .mist-item .m-days { font-size:12px; color:oklch(0.55 0.03 40); margin-top:3px; }
  .mist-step { display:flex; gap:12px; align-items:center; padding:12px 14px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:12px; margin-bottom:8px; }
  .mist-step .m-n { width:24px; height:24px; border-radius:50%; background:oklch(0.26 0.06 255); color:oklch(0.78 0.1 85); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .mist-step .m-text { font-size:13.5px; color:oklch(0.3 0.02 40); }

  .prayer-block { padding:14px 16px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:14px; margin-bottom:14px; }
  .prayer-block.navy { background:oklch(0.26 0.06 255); border:none; }
  .prayer-block .p-label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.26 0.06 255); margin-bottom:6px; }
  .prayer-block.navy .p-label { color:oklch(0.74 0.11 85); }
  .prayer-block .p-text { font-size:13.5px; color:oklch(0.3 0.02 40); line-height:1.6; }
  .prayer-block.navy .p-text { color:oklch(0.86 0.07 85); }
  .prayer-center { text-align:center; font-size:12.5px; font-style:italic; color:oklch(0.55 0.03 40); padding:6px 0; }

  .accordion { border:1px solid oklch(0.91 0.01 60); border-radius:14px; overflow:hidden; background:oklch(0.98 0.004 75); margin-bottom:8px; }
  .accordion-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; cursor:pointer; }
  .accordion-head .a-title { font-size:14px; font-weight:600; color:oklch(0.22 0.02 40); font-family:'Source Serif 4',serif; }
  .accordion-head .a-subtitle { font-size:12px; color:oklch(0.55 0.03 40); margin-top:2px; }
  .accordion-head .a-chevron { color:oklch(0.55 0.02 40); font-size:14px; }
  .accordion-body { padding:0 16px 16px; display:flex; flex-direction:column; gap:10px; }
  .accordion-q { display:flex; gap:8px; font-size:13.5px; color:oklch(0.3 0.02 40); line-height:1.55; }
  .accordion-q .q-n { color:oklch(0.26 0.06 255); font-weight:700; flex:0 0 auto; }
  .accordion-simple-body { padding:0 16px 16px; font-size:13px; color:oklch(0.3 0.02 40); line-height:1.7; }

  .novena-item { display:flex; align-items:center; gap:14px; padding:14px 16px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:14px; cursor:pointer; margin-bottom:10px; }
  .novena-item .n-icon { width:36px; height:36px; border-radius:50%; background:oklch(0.93 0.015 255); display:flex; align-items:center; justify-content:center; font-size:16px; flex:0 0 auto; }
  .novena-item .n-title { font-size:13.5px; font-weight:600; color:oklch(0.22 0.02 40); font-family:'Source Serif 4',serif; }
  .novena-item .n-sub { font-size:11.5px; color:oklch(0.55 0.03 40); margin-top:2px; }
  .novena-intro { font-size:12.5px; color:oklch(0.55 0.03 40); line-height:1.6; margin-bottom:16px; }
  .novena-day-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .novena-day-btn { width:32px; height:32px; border-radius:50%; border:1px solid oklch(0.9 0.01 60); background:oklch(0.98 0.004 75); color:oklch(0.4 0.02 40); font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'Work Sans',sans-serif; }
  .novena-day-btn.active { background:oklch(0.26 0.06 255); border-color:oklch(0.26 0.06 255); color:oklch(0.82 0.09 85); }
  .novena-text-card { padding:16px; background:oklch(0.98 0.004 75); border:1px solid oklch(0.91 0.01 60); border-radius:14px; }
  .novena-text-title { font-family:'Source Serif 4',serif; font-size:15px; font-weight:600; color:oklch(0.22 0.02 40); margin-bottom:10px; }
  .novena-text-body { font-size:13px; color:oklch(0.3 0.02 40); line-height:1.75; white-space:normal; }

  /* BOTTOM NAV */
  .bottom-nav { position:absolute; bottom:0; left:0; right:0; display:flex; background:oklch(0.995 0.004 75); border-top:1px solid oklch(0.91 0.01 60); padding:10px 12px 16px; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; padding:4px 0; color:oklch(0.6 0.02 40); background:none; border:none; font-family:'Work Sans',sans-serif; }
  .nav-btn.active { color:oklch(0.26 0.06 255); }
  .nav-btn .n-label { font-size:10.5px; font-weight:600; }
</style>
</head>
<body>

<div class="page">
  <div class="card">

    <div class="header">
      <div class="glyph">✦</div>
      <div class="title">Ora et Labora</div>
      <div class="subtitle">Christo nihil praeponere</div>
      <div class="rule"></div>
    </div>

    <div class="content">

      <!-- ROTINA -->
      <div class="tab-view" id="tab-rotina">
        <div class="section-label">Agenda da semana</div>
        <div class="week-strip" id="week-strip"></div>
        <div class="timeline" id="timeline"></div>
        <div id="timeline-empty"></div>
        <div id="timeline-form-wrap"></div>

        <div class="cat-pills" id="cat-pills"></div>
        <div id="checklist"></div>
      </div>

      <!-- CALENDARIO -->
      <div class="tab-view" id="tab-calendario">
        <div class="cal-header">
          <div class="cal-month" id="cal-month"></div>
          <div class="cal-nav">
            <span onclick="calMonthShift(-1)">‹</span>
            <span onclick="calMonthShift(1)">›</span>
          </div>
        </div>
        <div class="cal-weekdays">
          <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="section-label" style="margin-top:0;">Próximos eventos</div>
        <div id="upcoming-list"></div>
        <div id="cal-add-wrap"></div>
      </div>

      <!-- ORACAO -->
      <div class="tab-view" id="tab-oracao">
        <div id="oracao-content"></div>
      </div>

    </div>

    <div class="bottom-nav">
      <button class="nav-btn" id="nav-rotina" onclick="setTab('rotina')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="4" height="4" rx="1"></rect><rect x="3" y="15" width="4" height="4" rx="1"></rect><line x1="10" y1="7" x2="21" y2="7"></line><line x1="10" y1="17" x2="21" y2="17"></line></svg>
        <div class="n-label">Rotina</div>
      </button>
      <button class="nav-btn" id="nav-calendario" onclick="setTab('calendario')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <div class="n-label">Calendário</div>
      </button>
      <button class="nav-btn" id="nav-oracao" onclick="setTab('oracao')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"></line><line x1="6" y1="9" x2="18" y2="9"></line></svg>
        <div class="n-label">Oração</div>
      </button>
    </div>

  </div>
</div>

<script>
/* ============ DADOS FIXOS ============ */

  ],
};
const ROTINA_CATEGORIES = [

  { id: 'oracao', label: 'Oração' },
  { id: 'estudos', label: 'Estudos' },
];
const WEEKDAY_LABELS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTH_LABELS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

const MISTERIOS = {

      {title:"Dia 4 — O Espírito Santo é o Doador dos Dons", oracao:"Vinde Espírito Santo, enchei os corações dos vossos fiéis\ne acendei neles o fogo do Vosso amor.\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nOremos: Deus que instruístes os corações dos Vossos fiéis\ncom a luz do Espírito Santo, fazei que apreciemos retamente\ntodas as coisas segundo o mesmo Espírito\ne gozemos sempre de Suas consolações,\npor Cristo, Senhor Nosso. Amém!\n\n— Oração antes da meditação —\nÓ Divino Espírito, que pela Igreja sois chamado Criador,\nnão somente porque és em relação a nós criaturas,\nmas também porque movendo nas nossas almas santos pensamentos\ne afetos, criais em nós aquela santidade que é obra Vossa!\nVenha sobre nós a Vossa benéfica virtude,\ne enquanto Vos honrarmos com este devoto exercício,\ndigne-se a visitar com a Tua Divina Luz a nossa mente\ne com Tua Suprema Graça o nosso coração,\npara que as nossas orações subam agradáveis a Vós,\ne do Céu desça sobre nós a abundância\nde Vossas divinas misericórdias. Amém!\n\n— Meditação: O Espírito Santo é o Doador dos Dons —\nSendo próprio do amor beneficiar e repartir dons,\nisso acontece principalmente com o Amor por excelência\nque é o Espírito Santo.\n\nSão seus verdadeiros devotos aqueles que dEle recebem:\num filial Temor que os afasta do pecado;\numa fervorosa Piedade que os faz mais queridos a Deus;\numa Ciência que endereça os próprios juízos;\numa sobre-humana Fortaleza onde todo obstáculo seja superado;\no celeste Conselho para distinguir os movimentos da graça;\num sobrenatural Intelecto que é sustento para a fé;\ne uma Sabedoria celeste que os coloca em perfeito acordo com Deus.\n\nPobre é o nosso espírito de dons celestes.\nMas de onde surge a pobreza,\nenquanto estão abertos diante de nós os tesouros do Paráclito?\nO Espírito Santo concede seus melhores dons\nàqueles que os desejam, a quem pede,\na quem fielmente a eles correspondem.\n\n— Momento de meditação pessoal —\n\nConfesso, ó Amante Supremo dos homens,\nconfesso que a deplorável pobreza desta alma é pobreza consciente.\nEu mesmo me sujei, porque não apreciei, não desejei\ne não pedi com fervor os favores celestes\nque Vós tão amorosamente derramais nas vossas criaturas.\n\nMas Vós sois o Amor, o Amor onipotente.\nNão queira castigar este servo infiel,\nmas aceitando meu arrependimento,\nque uno à promessa de corresponder no futuro aos Vossos Dons.\nTornai a enriquecer-me benignamente dos Vossos Dons. Amém.\n\n— Oração Final —\nÓ prometido e suspirado Consolador, Espírito Santo,\nprocedente do Pai e do Filho, que escutando a unânime oração\ndos discípulos do Salvador, fraternalmente reunidos no Cenáculo,\ndescestes para consolar e santificar a Igreja nascente;\nsede propício às nossas súplicas,\nreacendei o Vosso Divino Fogo nos corações dos homens.\nFazei resplandecer a Vossa luz até os confins da Terra;\nchamai novamente ao seio da Mãe Igreja Romana\ntodas as Igrejas separadas.\n\nÓ Espírito Santo, que sois o Amor,\npiedade de tanta mediocridade e de tantas almas que se perdem!\nFazei com que rapidamente aconteça aquilo que Davi profetizava:\n\"Mandai o Teu Espírito\".\nFazei-nos novas criaturas, e assim renovareis a face da Terra.\n\nUnidos em oração, com plena confiança repitamos:\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nRezar: Pai Nosso, Ave-Maria, Glória ao Pai.\n\nQue o Senhor nos abençoe, nos livre de todo o mal\ne nos conduza à vida eterna! Amém."},

      {title:"Dia 6 — O Espírito Santo é nosso Advogado", oracao:"Vinde Espírito Santo, enchei os corações dos vossos fiéis\ne acendei neles o fogo do Vosso amor.\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nOremos: Deus que instruístes os corações dos Vossos fiéis\ncom a luz do Espírito Santo, fazei que apreciemos retamente\ntodas as coisas segundo o mesmo Espírito\ne gozemos sempre de Suas consolações,\npor Cristo, Senhor Nosso. Amém!\n\n— Oração antes da meditação —\nÓ Divino Espírito, que pela Igreja sois chamado Criador,\nnão somente porque és em relação a nós criaturas,\nmas também porque movendo nas nossas almas santos pensamentos\ne afetos, criais em nós aquela santidade que é obra Vossa!\nVenha sobre nós a Vossa benéfica virtude,\ne enquanto Vos honrarmos com este devoto exercício,\ndigne-se a visitar com a Tua Divina Luz a nossa mente\ne com Tua Suprema Graça o nosso coração,\npara que as nossas orações subam agradáveis a Vós,\ne do Céu desça sobre nós a abundância\nde Vossas divinas misericórdias. Amém!\n\n— Meditação: O Espírito Santo é nosso Advogado —\nAos cristãos não falta este Advogado.\nFoi o Amante Salvador que nos prometeu e nos deu,\ne é o seu mesmo Amor: o Espírito Santo.\n\nEste Amor está especialmente conosco\ne vem em auxílio da nossa fraqueza quando rezamos.\nA nossa miséria é tão grande que não sabemos rezar como convém.\nMas é aqui que nos ajuda o Espírito Santo,\nque dentro de nós ora e suplica com gemidos inenarráveis.\n\nPortanto, Deus mesmo ora em mim!\nO Espírito Santo reza em mim e eleva a minha alma\nàs fontes da Vida Eterna para enriquecê-la de todo bem!\nO que pode ser negado para aquele cuja oração sobe ao céu\nunida aos gemidos inenarráveis do divino Amor?\n\n— Momento de meditação pessoal —\n\nÓ Divino Advogado das almas, que sois todo Amor,\neu exulto e me alegro em saber que sois assim tão bom\ne que Vos dignastes morar dentro de nós,\norar em nós e enviar ao Coração do Pai Celeste\naqueles preciosos e inefáveis gemidos\nque O movem a nos conceder toda graça.\n\nComo me arrependo, ó Espírito Santo,\npor ter Vos conhecido tão pouco!\n\nA partir de agora, peço-Vos perdão, ó Espírito Santo,\ne prometo não Vos esquecer mais\ne proclamar para os outros as verdades católicas,\nque são luz para a mente e alegria para o coração. Amém.\n\n— Oração Final —\nÓ prometido e suspirado Consolador, Espírito Santo,\nprocedente do Pai e do Filho, que escutando a unânime oração\ndos discípulos do Salvador, fraternalmente reunidos no Cenáculo,\ndescestes para consolar e santificar a Igreja nascente;\nsede propício às nossas súplicas,\nreacendei o Vosso Divino Fogo nos corações dos homens.\nFazei resplandecer a Vossa luz até os confins da Terra;\nchamai novamente ao seio da Mãe Igreja Romana\ntodas as Igrejas separadas.\n\nÓ Espírito Santo, que sois o Amor,\npiedade de tanta mediocridade e de tantas almas que se perdem!\nFazei com que rapidamente aconteça aquilo que Davi profetizava:\n\"Mandai o Teu Espírito\".\nFazei-nos novas criaturas, e assim renovareis a face da Terra.\n\nUnidos em oração, com plena confiança repitamos:\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nRezar: Pai Nosso, Ave-Maria, Glória ao Pai.\n\nQue o Senhor nos abençoe, nos livre de todo o mal\ne nos conduza à vida eterna! Amém."},
      {title:"Dia 7 — O Espírito Santo é o Santificador das almas", oracao:"Vinde Espírito Santo, enchei os corações dos vossos fiéis\ne acendei neles o fogo do Vosso amor.\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nOremos: Deus que instruístes os corações dos Vossos fiéis\ncom a luz do Espírito Santo, fazei que apreciemos retamente\ntodas as coisas segundo o mesmo Espírito\ne gozemos sempre de Suas consolações,\npor Cristo, Senhor Nosso. Amém!\n\n— Oração antes da meditação —\nÓ Divino Espírito, que pela Igreja sois chamado Criador,\nnão somente porque és em relação a nós criaturas,\nmas também porque movendo nas nossas almas santos pensamentos\ne afetos, criais em nós aquela santidade que é obra Vossa!\nVenha sobre nós a Vossa benéfica virtude,\ne enquanto Vos honrarmos com este devoto exercício,\ndigne-se a visitar com a Tua Divina Luz a nossa mente\ne com Tua Suprema Graça o nosso coração,\npara que as nossas orações subam agradáveis a Vós,\ne do Céu desça sobre nós a abundância\nde Vossas divinas misericórdias. Amém!\n\n— Meditação: O Divino Paráclito — Santificador das almas —\nO Espírito Santo é o Santificador das almas,\no qual com força e suavidade conduz as almas ao santo viver.\n\nÉ Ele que ilumina o pecador no seu estado de perigo,\nacorda-o do sono da morte,\ninspira-o no desejo de voltar para Deus.\nÉ Ele quem o faz olhar a doçura da virtude,\na felicidade da paz e as consolações do divino amor.\n\nO Divino Espírito cumpre em nós aquela promessa da Escritura:\n\"Vos darei um coração novo e um espírito novo.\nVos tirarei da vossa sepultura,\nvos darei o Meu Espírito e vivereis.\nEu disse, eu farei.\" (Ez 37)\n\n— Momento de meditação pessoal —\n\nÓ meu Deus, considerando todas as obras do Vosso Amor,\nme dou conta que sempre são mais admiráveis\ndo que todos os prodígios.\n\nO homem pecou, perdeu o Espírito Santo,\ne se fez escravo de Lúcifer.\nMas Vossa mão veio sobre o homem caído e o levantou.\n\nE saber que esta maravilha de amor realizastes por nós e em nós,\ntambém por mim e em mim.\nComo farei para amar-Vos e não pensar senão em Vós,\nó Espírito Santo de Amor!\n\nPerdoai a mim e a todos os cristãos pela ingratidão\nde Vos termos esquecido. Amém.\n\n— Oração Final —\nÓ prometido e suspirado Consolador, Espírito Santo,\nprocedente do Pai e do Filho, que escutando a unânime oração\ndos discípulos do Salvador, fraternalmente reunidos no Cenáculo,\ndescestes para consolar e santificar a Igreja nascente;\nsede propício às nossas súplicas,\nreacendei o Vosso Divino Fogo nos corações dos homens.\nFazei resplandecer a Vossa luz até os confins da Terra;\nchamai novamente ao seio da Mãe Igreja Romana\ntodas as Igrejas separadas.\n\nÓ Espírito Santo, que sois o Amor,\npiedade de tanta mediocridade e de tantas almas que se perdem!\nFazei com que rapidamente aconteça aquilo que Davi profetizava:\n\"Mandai o Teu Espírito\".\nFazei-nos novas criaturas, e assim renovareis a face da Terra.\n\nUnidos em oração, com plena confiança repitamos:\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nRezar: Pai Nosso, Ave-Maria, Glória ao Pai.\n\nQue o Senhor nos abençoe, nos livre de todo o mal\ne nos conduza à vida eterna! Amém."},
      {title:"Dia 8 — Nossos deveres para com o Espírito Santo", oracao:"Vinde Espírito Santo, enchei os corações dos vossos fiéis\ne acendei neles o fogo do Vosso amor.\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nOremos: Deus que instruístes os corações dos Vossos fiéis\ncom a luz do Espírito Santo, fazei que apreciemos retamente\ntodas as coisas segundo o mesmo Espírito\ne gozemos sempre de Suas consolações,\npor Cristo, Senhor Nosso. Amém!\n\n— Oração antes da meditação —\nÓ Divino Espírito, que pela Igreja sois chamado Criador,\nnão somente porque és em relação a nós criaturas,\nmas também porque movendo nas nossas almas santos pensamentos\ne afetos, criais em nós aquela santidade que é obra Vossa!\nVenha sobre nós a Vossa benéfica virtude,\ne enquanto Vos honrarmos com este devoto exercício,\ndigne-se a visitar com a Tua Divina Luz a nossa mente\ne com Tua Suprema Graça o nosso coração,\npara que as nossas orações subam agradáveis a Vós,\ne do Céu desça sobre nós a abundância\nde Vossas divinas misericórdias. Amém!\n\n— Meditação: Nossos deveres para com o Espírito Santo —\nO Espírito Santo, como Deus, possui todo o direito de adoração,\nsubmissão e amor, assim como devemos render ao Pai e ao Filho.\n\nComo o Espírito Santo é Amor, e o Amor deve ser amado,\nentre todos esses deveres o que deve reinar é a primazia do Amor.\n\nMas como cumpriremos nossos deveres para com o Espírito Santo\nse rara e friamente nos recordamos dEle?\nO esquecimento é adoração? O esquecimento é gratidão? É amor?\nNão: é ingratidão, desamor e desprezo.\n\nPara nós que conscientemente vivemos no sobrenatural,\nexistiria maior vergonha que viver toda a jornada\ncomo se o Espírito Santo não existisse,\ncomo se Ele não habitasse pessoalmente dentro de nós?\n\n— Momento de meditação pessoal —\n\nÓ Divino Espírito Santo,\ncomo eu me enganava pensando que fosse somente com pecados\nque Te contristaria!\nAgora sei que Te contristei mais ainda quando Te esqueci.\n\nDevemos gemer sobre a nossa ingratidão e pedir perdão.\nE ao Te pedirmos perdão, ó Espírito Santo,\nacrescentamos a promessa de honrar-Vos no futuro\ncom atos de especial adoração e de verdadeiro reconhecimento.\nSois autor e doador da graça, Santificador e Doce Hóspede da alma.\nPor tudo isto, com total devoção,\ndevemos voltar para Vós todos os nossos pensamentos. Amém.\n\n— Oração Final —\nÓ prometido e suspirado Consolador, Espírito Santo,\nprocedente do Pai e do Filho, que escutando a unânime oração\ndos discípulos do Salvador, fraternalmente reunidos no Cenáculo,\ndescestes para consolar e santificar a Igreja nascente;\nsede propício às nossas súplicas,\nreacendei o Vosso Divino Fogo nos corações dos homens.\nFazei resplandecer a Vossa luz até os confins da Terra;\nchamai novamente ao seio da Mãe Igreja Romana\ntodas as Igrejas separadas.\n\nÓ Espírito Santo, que sois o Amor,\npiedade de tanta mediocridade e de tantas almas que se perdem!\nFazei com que rapidamente aconteça aquilo que Davi profetizava:\n\"Mandai o Teu Espírito\".\nFazei-nos novas criaturas, e assim renovareis a face da Terra.\n\nUnidos em oração, com plena confiança repitamos:\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nRezar: Pai Nosso, Ave-Maria, Glória ao Pai.\n\nQue o Senhor nos abençoe, nos livre de todo o mal\ne nos conduza à vida eterna! Amém."},
      {title:"Dia 9 — Os benefícios do Espírito Santo", oracao:"Vinde Espírito Santo, enchei os corações dos vossos fiéis\ne acendei neles o fogo do Vosso amor.\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nOremos: Deus que instruístes os corações dos Vossos fiéis\ncom a luz do Espírito Santo, fazei que apreciemos retamente\ntodas as coisas segundo o mesmo Espírito\ne gozemos sempre de Suas consolações,\npor Cristo, Senhor Nosso. Amém!\n\n— Oração antes da meditação —\nÓ Divino Espírito, que pela Igreja sois chamado Criador,\nnão somente porque és em relação a nós criaturas,\nmas também porque movendo nas nossas almas santos pensamentos\ne afetos, criais em nós aquela santidade que é obra Vossa!\nVenha sobre nós a Vossa benéfica virtude,\ne enquanto Vos honrarmos com este devoto exercício,\ndigne-se a visitar com a Tua Divina Luz a nossa mente\ne com Tua Suprema Graça o nosso coração,\npara que as nossas orações subam agradáveis a Vós,\ne do Céu desça sobre nós a abundância\nde Vossas divinas misericórdias. Amém!\n\n— Meditação: Os benefícios do Espírito Santo —\nOs benefícios revelam o Benfeitor,\ne quanto mais excelentes e múltiplos são os benefícios,\ntanto mais indicam ser excelente e amoroso o Benfeitor.\n\nA Igreja, com os nomes que Lhe concede, nos mostra suas graças:\n\"Luz dos Corações\" — a graça das explicações Divinas.\n\"Fogo\" — o Divino Amor que chega ao nosso coração.\n\"Doce Hóspede da alma\" — sua presença em nós.\n\"Pai dos Pobres, Dispensador de Dons, Fonte Viva,\nConsolador Perfeito\" — múltiplos benefícios incessantes.\n\nComo o fogo converte em fogo aquilo que nele é imerso,\nassim o Divino Fogo do Espírito Santo,\nse não pode fazer-nos divinos por natureza,\ntorna-nos divinos pela graça.\n\n— Momento de meditação pessoal —\n\nÓ Divino Espírito, entre todos os Vossos dons,\nexiste um infinitamente mais precioso que os outros:\no Dom que não tem nome particular,\nporque sois Vós mesmo que verdadeiramente Vos doais às almas justas.\n\nO que farão as nossas almas no fim desta Novena?\nPediremos o Dom do Altíssimo Deus: Vós mesmo!\nE para obtê-Lo, deixaremos lugar no nosso coração,\ntirando todo afeto que não Vos agrada.\n\nVem! Vem! Vem!\nVisitai as mentes dos Vossos servos\ne enchei os corações de abundantes graças.\nVem! E com as Vossas chamas, erradicai de nós o velho Adão.\nEstendei todos os Vossos benefícios a todos os crentes,\ne assim obteremos mais rapidamente\na renovação da face da Terra. Amém.\n\n— Oração Final —\nÓ prometido e suspirado Consolador, Espírito Santo,\nprocedente do Pai e do Filho, que escutando a unânime oração\ndos discípulos do Salvador, fraternalmente reunidos no Cenáculo,\ndescestes para consolar e santificar a Igreja nascente;\nsede propício às nossas súplicas,\nreacendei o Vosso Divino Fogo nos corações dos homens.\nFazei resplandecer a Vossa luz até os confins da Terra;\nchamai novamente ao seio da Mãe Igreja Romana\ntodas as Igrejas separadas.\n\nÓ Espírito Santo, que sois o Amor,\npiedade de tanta mediocridade e de tantas almas que se perdem!\nFazei com que rapidamente aconteça aquilo que Davi profetizava:\n\"Mandai o Teu Espírito\".\nFazei-nos novas criaturas, e assim renovareis a face da Terra.\n\nUnidos em oração, com plena confiança repitamos:\nEnviai o Vosso Espírito e tudo será criado,\ne renovareis a face da Terra!\n\nRezar: Pai Nosso, Ave-Maria, Glória ao Pai.\n\nQue o Senhor nos abençoe, nos livre de todo o mal\ne nos conduza à vida eterna! Amém."}

  {
    id:'misericordia', icon:'❤️',
    title:'Novena da Divina Misericórdia',
    sub:'Revelada a Santa Faustina · Sexta-feira Santa até a Festa da Misericórdia',
    color:'#a93226',
    intro:'Jesus disse a Santa Faustina: "Durante esta novena concederei às almas toda a espécie de graças. Em cada dia conduzirás ao Meu Coração um grupo diferente de almas, e as mergulharás no oceano da Minha Misericórdia." (Diário, nn. 1210-1228)',
    days:[

      {title:"Dia 1 — Toda a humanidade", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-me toda a humanidade, mas especialmente todos os pecadores,\ne mergulha-os no oceano da Minha Misericórdia.\"\n\nMisericordiosíssimo Jesus, de Quem é próprio ter compaixão de nós e perdoar,\nnão olheis os nossos pecados;\natendei antes à confiança que temos na vossa infinita bondade.\nAcolhei-nos na morada do vosso compassivo Coração\ne nunca nos deixeis afastar dEle.\nNós Vo-lo pedimos pelo amor que Vos une ao Pai e ao Espírito Santo.\n\nEterno Pai, atendei com olhar de misericórdia\na humanidade contida no tão compassivo Coração de Jesus,\nmas especialmente os pobres pecadores.\nPela Sua dolorosa Paixão, mostrai-nos a vossa Misericórdia,\npara que glorifiquemos a onipotência da Vossa Misericórdia\npor toda a eternidade. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 2 — Sacerdotes e religiosos", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me as almas dos sacerdotes e religiosos\ne mergulha-as na minha insondável Misericórdia.\"\n\nMisericordiosíssimo Jesus, de Quem procede todo o bem,\naumentai nos sacerdotes e religiosos a graça,\npara que possam praticar dignas obras de misericórdia,\na fim de que todos aqueles que com eles se cruzam\nglorifiquem o Pai da Misericórdia que está nos Céus.\n\nEterno Pai, atendei com olhar de Misericórdia\nà porção eleita da vossa vinha: as almas dos sacerdotes e religiosos.\nConcedei-lhes a força da vossa bênção,\npara que possam guiar os fiéis que lhes estão confiados\npelos caminhos da salvação\ne juntamente com eles cantar a glória\nda vossa insondável Misericórdia por toda a eternidade. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 3 — Almas piedosas e fiéis", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me todas as almas piedosas e fiéis\ne mergulha-as no oceano da minha Misericórdia.\"\n\nMisericordiosíssimo Jesus,\nque dos tesouros da vossa misericórdia\nderramais abundantes bênçãos sobre todos,\nacolhei-nos na morada do vosso tão compassivo Coração\ne não nos deixeis afastar dEle.\n\nEterno Pai, olhai com Misericórdia\npara as almas piedosas e fiéis, herança do vosso Filho.\nPela Sua dolorosa Paixão,\nconcedei-lhes a vossa bênção e rodeai-as da vossa incessante proteção,\npara que não percam o tesouro inestimável da fé.\nAssim, com a multidão dos Anjos e dos Santos,\nglorifiquem a vossa infinita Misericórdia pelos séculos dos séculos. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 4 — Os pagãos e os que não conhecem Jesus", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me os pagãos e todos os que ainda não Me conhecem.\nMergulha-os no mar da minha Misericórdia.\"\n\nMisericordiosíssimo Jesus, sois a Luz do mundo inteiro,\nrecebei na morada do vosso compassivo Coração\nas almas dos pagãos que ainda Vos não conhecem.\nQue os raios da vossa graça iluminem os seus olhos,\npara que também eles glorifiquem as maravilhas da vossa Misericórdia.\n\nEterno Pai, olhai com Misericórdia\npara as almas dos pagãos e daqueles que ainda Vos não conhecem.\nAtraí estas almas, que não conhecem ainda\na grande felicidade que é amar-Vos, à luz do Evangelho.\nFazei que também elas glorifiquem\na liberalidade da vossa Misericórdia por toda a eternidade. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 5 — Os cristãos separados da Igreja", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me as almas dos cristãos separados da unidade da Igreja\ne mergulha-as no oceano da Minha Misericórdia.\"\n\nMisericordiosíssimo Jesus, sois a própria bondade\ne não recusais a luz àqueles que a imploram.\nRecebei na morada do vosso tão compassivo Coração\nas almas dos nossos irmãos separados,\ne atraí-as pela vossa luz à unidade da Igreja.\n\nEterno Pai, atendei com olhar de Misericórdia\nàs almas dos nossos irmãos separados.\nPelo amor do vosso Filho e pela amarga Paixão que suportou também eles,\nnão tenhais em conta os seus erros;\nJesus já lhes abriu o Seu compassivo Coração.\nFazei que elas glorifiquem a vossa Misericórdia\npor toda a eternidade. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 6 — Almas mansos e humildes", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me as almas dos mansos e dos humildes,\nassim como as almas dos pequeninos.\"\n\nMisericordiosíssimo Jesus,\nque dissestes: \"Aprendei de Mim que sou manso e humilde de coração\",\nrecebei na morada do vosso tão compassivo Coração\nas almas dos mansos e humildes assim como as almas dos pequeninos.\nEstas almas põem em êxtase o Céu\ne são o especial encanto do Pai celestial.\nDiante do Trono de Deus, são como um ramalhete\ncujo perfume deleita o próprio Deus.\n\nEterno Pai, atendei com olhar de Misericórdia\nàs almas dos mansos e humildes e dos pequeninos.\nSuplico-Vos, pelo amor e predileção que tendes para com estas almas,\nque abençoeis o mundo inteiro,\npara que todas as almas, em uníssono,\ncantem louvores à vossa Misericórdia por toda a eternidade. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 7 — Almas que veneram a Misericórdia", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me as almas que especialmente\nvenerem e louvam a Minha Misericórdia.\"\n\nMisericordiosíssimo Jesus, que sois o próprio Amor,\naceitai na morada do vosso tão compassivo Coração\naquelas almas que, com especial devoção,\nveneram e louvam a grandeza da vossa Misericórdia.\nEstas almas tornadas poderosas pela força do próprio Deus,\navançam por entre tribulações e adversidades,\nconfiando na vossa Misericórdia.\n\nEterno Pai, sede compassivo para com as almas\nque glorificam e honram o vosso maior atributo,\nisto é, a vossa insondável Misericórdia.\nQue se cumpra nelas a promessa de Jesus:\n\"As almas que veneram a Minha insondável Misericórdia,\nEu mesmo as defenderei durante a vida\ne, especialmente, na hora da morte.\" Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 8 — Almas do purgatório", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me as almas que se encontram no Purgatório\ne mergulha-as no abismo da Minha Misericórdia.\"\n\nMisericordiosíssimo Jesus,\nque dissestes Vós próprio que queríeis misericórdia,\neis que levo à morada do vosso tão compassivo Coração\nas almas do Purgatório.\nEstas almas que Vos são tão queridas\ndevem no entanto reparar a vossa Justiça.\nQue as torrentes do Sangue e da Água que brotaram do vosso Coração\nextingam as chamas do fogo do Purgatório,\npara que também ali seja glorificado\no poder da vossa Misericórdia.\n\nEterno Pai, atendei com olhar de Misericórdia\nàs almas que sofrem no Purgatório.\nPela dolorosa Paixão de Jesus, vosso Filho,\ne por toda a amargura que atingiu a Sua Alma Santíssima,\nmostrai a vossa Misericórdia às almas\nque se encontram sob o olhar da vossa Justiça.\nOlhai para elas através das Chagas de Jesus,\nporque acreditamos que a vossa Bondade e Piedade são sem limites. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"},
      {title:"Dia 9 — Almas tíbias", oracao:"Palavras de Jesus a Santa Faustina:\n\"Hoje traz-Me as almas tíbias\ne mergulha-as no abismo da Minha Misericórdia.\"\n\nÓ compassivo Jesus, que sois a própria Compaixão,\ntrago à morada do vosso tão compassivo Coração as almas tíbias.\nQue nesse fogo do vosso puro Amor\nse aqueçam estas almas gélidas, semelhantes a cadáveres,\nque Vos causam tanta repugnância.\nÓ Jesus, muito compassivo,\nusai da omnipotência da vossa Misericórdia\ne atraí-as ao fogo ardente do vosso amor,\ne revigorai-as com um amor santo, pois Vós tudo podeis.\n\nEterno Pai, olhai com Misericórdia para as almas tíbias,\nconfiadas no Coração tão compassivo de Jesus.\nÓ Pai de Misericórdia,\nsuplico-Vos pela amargura da Paixão do vosso Filho\ne pela Sua Agonia de três horas na Cruz,\npermiti que também elas glorifiquem\no abismo da vossa Misericórdia. Amém.\n\n— Rezar o Terço da Divina Misericórdia —"}

      {title:"Dia 1 — Santificado no ventre de sua mãe", oracao:"Oração preparatória (rezar todos os dias):\n\nDeus e Senhor meu, Uno e Trino, Pai, Filho e Espírito Santo,\ncreio que estou em Vossa soberana presença agora,\nquando pretendo consagrar a São José esta novena.\n\nAdoro-Vos com todo o meu coração,\nporque sois infinitamente bom e digno de ser amado sobre todas as coisas.\nArrependo-me dos muitos pecados que fiz contra Vossa Divina Majestade.\n\nQuero, nesta novena, aprender as virtudes que, com tanta perfeição,\npraticou o glorioso Patriarca São José e alcançar,\npor sua intercessão, as graças de que tanto preciso.\n\nVenho, portanto, com toda a confiança, implorar a divina clemência,\nnão fiado em minha fraqueza, mas no poder e valimento de São José. Amém.\n\nDou graças à Santíssima Trindade, Santíssimo São José,\npelos muitos privilégios, méritos e virtudes com que vos enriqueceu\ne, principalmente, pelo grande mérito de ter sido santificado\nno ventre de vossa mãe e confirmado em graça.\n\nPor esse privilégio e pela grande alegria que Ele vos causou,\nsuplico-vos, ó meu querido pai, que me alcanceis de Deus\num grande ódio ao pecado, grande amor às virtudes\ne à minha salvação eterna. Amém.\n\nOração final (rezar todos os dias):\n\nLembrai-vos, ó puríssimo Esposo da Virgem Maria,\nó meu doce Protetor São José,\nque jamais se ouviu dizer que alguém tivesse invocado vossa proteção,\nimplorando vosso socorro e não fosse por vós consolado.\n\nCom grande confiança, venho a vossa presença recomendar-me fervorosamente a vós.\nNão desprezeis as minhas súplicas, ó pai adotivo do Redentor,\nmas dignai-vos acolhê-la piedosamente. Assim seja.\n\nV. Rogai por nós, José santíssimo.\nR. Para que sejamos dignos das promessas de Cristo.\n\nOremos: Ó Jesus, que por uma inefável providência,\ndignastes-Vos escolher o bem-aventurado esposo de Vossa Mãe Santíssima;\nconcedei-nos que aquele mesmo que veneramos como protetor,\nmereçamos tê-lo no céu por nosso intercessor.\n       {title:"Dia 5 — Que impôs o nome de Jesus", oracao:"Oração preparatória (rezar todos os dias):\n\nDeus e Senhor meu, Uno e Trino, Pai, Filho e Espírito Santo,\ncreio que estou em Vossa soberana presença agora,\nquando pretendo consagrar a São José esta novena.\n\nAdoro-Vos com todo o meu coração,\nporque sois infinitamente bom e digno de ser amado sobre todas as coisas.\nArrependo-me dos muitos pecados que fiz contra Vossa Divina Majestade.\n\nQuero, nesta novena, aprender as virtudes que, com tanta perfeição,\npraticou o glorioso Patriarca São José e alcançar,\npor sua intercessão, as graças de que tanto preciso.\n\nVenho, portanto, com toda a confiança, implorar a divina clemência,\nnão fiado em minha fraqueza, mas no poder e valimento de São José. Amém.\n\nQue grande dor sofrestes, nosso querido São José,\nquando vistes derramar-se o preciosíssimo Sangue de Cristo na circuncisão!\n\nSão José, dai-me a conhecer o preço do Sangue de Jesus\npara que nunca deixe perder a menor gota.\n\nVossas mãos sagradas amparam Jesus, o Salvador do mundo!\nSão José, que alegria a vossa, quando destes ao Salvador\no nome de Jesus — a chave que nos abre a porta do céu!\n\nPelo nome adorável, Jesus,\npeço-vos as graças que desejo alcançar nesta novena,\nse forem para maior glória de Deus e para o bem de minha alma. Amém.\n\nOração final (rezar todos os dias):\n\nLembrai-vos, ó puríssimo Esposo da Virgem Maria,\nó meu doce Protetor São José,\nque jamais se ouviu dizer que alguém tivesse invocado vossa proteção,\nimplorando vosso socorro e não fosse por vós consolado.\n\nCom grande confiança, venho a vossa presença recomendar-me fervorosamente a vós.\nNão desprezeis as minhas súplicas, ó pai adotivo do Redentor,\nmas dignai-vos acolhê-la piedosamente. Assim seja.\n\nV. Rogai por nós, José santíssimo.\nR. Para que sejamos dignos das promessas de Cristo.\n\nOremos: Ó Jesus, que por uma inefável providência,\ndignastes-Vos escolher o bem-aventurado esposo de Vossa Mãe Santíssima;\nconcedei-nos que aquele mesmo que veneramos como protetor,\nmereçamos tê-lo no céu por nosso intercessor.\nVós que viveis e reinais por todos os séculos dos séculos. Amém.\n\nRezar 7 Pais-Nossos, 7 Ave-Marias e 7 Glórias ao Pai\nem honra das alegrias e dores do glorioso patriarca."},
      {title:"Dia 6 — Consolador de Maria na Apresentação", oracao:"Oração preparatória (rezar todos os dias):\n\nDeus e Senhor meu, Uno e Trino, Pai, Filho e Espírito Santo,\ncreio que estou em Vossa soberana presença agora,\nquando pretendo consagrar a São José esta novena.\n\nAdoro-Vos com todo o meu coração,\nporque sois infinitamente bom e digno de ser amado sobre todas as coisas.\nArrependo-me dos muitos pecados que fiz contra Vossa Divina Majestade.\n\nQuero, nesta novena, aprender as virtudes que, com tanta perfeição,\npraticou o glorioso Patriarca São José e alcançar,\npor sua intercessão, as graças de que tanto preciso.\n\nVenho, portanto, com toda a confiança, implorar a divina clemência,\nnão fiado em minha fraqueza, mas no poder e valimento de São José. Amém.\n\nÓ meu boníssimo São José, protetor e amparo dos desvalidos,\nconfraternizo-me convosco, pacienciosíssimo José,\npela ferida que em vosso coração fizeram as palavras do Santo Simeão,\ncom que anunciara a Maria que uma espada de dor haveria de\natravessar Seu delicado e amorosíssimo coração.\n\nEu, sim, posso e devo, com minha vida e bons costumes,\nconsolar a Maria, evitando e reparando os meus pecados.\n\nAjudai, José poderosíssimo, minha pobreza espiritual,\nalcançando-me de Nosso Senhor a graça de nunca ser,\npor minha culpa, causa das penas de Jesus e das dores de Maria. Amém.\n\nOração final (rezar todos os dias):\n\nLembrai-vos, ó puríssimo Esposo da Virgem Maria,\nó meu doce Protetor São José,\nque jamais se ouviu dizer que alguém tivesse invocado vossa proteção,\nimplorando vosso socorro e não fosse por vós consolado.\n\nCom grande confiança, venho a vossa presença recomendar-me fervorosamente a vós.\nNão desprezeis as minhas súplicas, ó pai adotivo do Redentor,\nmas dignai-vos acolhê-la piedosamente. Assim seja.\n\nV. Rogai por nós, José santíssimo.\nR. Para que sejamos dignos das promessas de Cristo.\n\nOremos: Ó Jesus, que por uma inefável providência,\ndignastes-Vos escolher o bem-aventurado esposo de Vossa Mãe Santíssima;\nconcedei-nos que aquele mesmo que veneramos como protetor,\nmereçamos tê-lo no céu por nosso intercessor.\nVós que viveis e reinais por todos os séculos dos séculos. Amém.\n\nRezar 7 Pais-Nossos, 7 Ave-Marias e 7 Glórias ao Pai\nem honra das alegrias e dores do glorioso patriarca."},
      {title:"Dia 7 — Guardião da Sagrada Família no Egito", oracao:"Oração preparatória (rezar todos os dias):\n\nDeus e Senhor meu, Uno e Trino, Pai, Filho e Espírito Santo,\ncreio que estou em Vossa soberana presença agora,\nquando pretendo consagrar a São José esta novena.\n\nAdoro-Vos com todo o meu coração,\nporque sois infinitamente bom e digno de ser amado sobre todas as coisas.\nArrependo-me dos muitos pecados que fiz contra Vossa Divina Majestade.\n\nQuero, nesta novena, aprender as virtudes que, com tanta perfeição,\npraticou o glorioso Patriarca São José e alcançar,\npor sua intercessão, as graças de que tanto preciso.\n\nVenho, portanto, com toda a confiança, implorar a divina clemência,\nnão fiado em minha fraqueza, mas no poder e valimento de São José. Amém.\n\nSão José, permiti que, em espírito,\neu vos acompanhe na viagem ao Egito\npara admirar vossos sacrifícios e imitar vossas virtudes.\n\nPeço-vos humildemente que tireis de mim\na sede dos prazeres mundanos\ne dai-me a fome e a sede de todas as virtudes,\nprincipalmente a humildade, a paciência e a mortificação.\n\nAssim como vos alegrastes com a queda dos ídolos do Egito,\nalegra-se meu coração com a queda\ndos ídolos das afeições desregradas e das paixões desordenadas. Amém.\n\nOração final (rezar todos os dias):\n\nLembrai-vos, ó puríssimo Esposo da Virgem Maria,\nó meu doce Protetor São José,\nque jamais se ouviu dizer que alguém tivesse invocado vossa proteção,\nimplorando vosso socorro e não fosse por vós consolado.\n\nCom grande confiança, venho a vossa presença recomendar-me fervorosamente a vós.\nNão desprezeis as minhas súplicas, ó pai adotivo do Redentor,\nmas dignai-vos acolhê-la piedosamente. Assim seja.\n\nV. Rogai por nós, José santíssimo.\nR. Para que sejamos dignos das promessas de Cristo.\n\nOremos: Ó Jesus, que por uma inefável providência,\ndignastes-Vos escolher o bem-aventurado esposo de Vossa Mãe Santíssima;\nconcedei-nos que aquele mesmo que veneramos como protetor,\nmereçamos tê-lo no céu por nosso intercessor.\nVós que viveis e reinais por todos os séculos dos séculos. Amém.\n\nRezar 7 Pais-Nossos, 7 Ave-Marias e 7 Glórias ao Pai\nem honra das alegrias e dores do glorioso patriarca."},
      {title:"Dia 8 — Pai obediente no retorno de Nazaré", oracao:"Oração preparatória (rezar todos os dias):\n\nDeus e Senhor meu, Uno e Trino, Pai, Filho e Espírito Santo,\ncreio que estou em Vossa soberana presença agora,\nquando pretendo consagrar a São José esta novena.\n\nAdoro-Vos com todo o meu coração,\nporque sois infinitamente bom e digno de ser amado sobre todas as coisas.\nArrependo-me dos muitos pecados que fiz contra Vossa Divina Majestade.\n\nQuero, nesta novena, aprender as virtudes que, com tanta perfeição,\npraticou o glorioso Patriarca São José e alcançar,\npor sua intercessão, as graças de que tanto preciso.\n\nVenho, portanto, com toda a confiança, implorar a divina clemência,\nnão fiado em minha fraqueza, mas no poder e valimento de São José. Amém.\n\nConfraternizo-me convosco, terníssimo José,\npor causa das privações a que vistes sujeita vossa amada família\nna terra de peregrinação.\n\nPela alegria imensa que inundou vosso coração\nquando Jesus, pela primeira vez, vos deu o doce nome de pai,\nsuplico-vos que me ensineis a obedecer aos meus superiores\ne a sofrer, com paciência e resignação,\nas provas que a Divina Providência se dignar enviar-me. Amém.\n\nOração final (rezar todos os dias):\n\nLembrai-vos, ó puríssimo Esposo da Virgem Maria,\nó meu doce Protetor São José,\nque jamais se ouviu dizer que alguém tivesse invocado vossa proteção,\nimplorando vosso socorro e não fosse por vós consolado.\n\nCom grande confiança, venho a vossa presença recomendar-me fervorosamente a vós.\nNão desprezeis as minhas súplicas, ó pai adotivo do Redentor,\nmas dignai-vos acolhê-la piedosamente. Assim seja.\n\nV. Rogai por nós, José santíssimo.\nR. Para que sejamos dignos das promessas de Cristo.\n\nOremos: Ó Jesus, que por uma inefável providência,\ndignastes-Vos escolher o bem-aventurado esposo de Vossa Mãe Santíssima;\nconcedei-nos que aquele mesmo que veneramos como protetor,\nmereçamos tê-lo no céu por nosso intercessor.\nVós que viveis e reinais por todos os séculos dos séculos. Amém.\n\nRezar 7 Pais-Nossos, 7 Ave-Marias e 7 Glórias ao Pai\nem honra das alegrias e dores do glorioso patriarca."},
      {title:"Dia 9 — Que achou Jesus no Templo", oracao:"Oração preparatória (rezar todos os dias):\n\nDeus e Senhor meu, Uno e Trino, Pai, Filho e Espírito Santo,\ncreio que estou em Vossa soberana presença agora,\nquando pretendo consagrar a São José esta novena.\n\nAdoro-Vos com todo o meu coração,\nporque sois infinitamente bom e digno de ser amado sobre todas as coisas.\nArrependo-me dos muitos pecados que fiz contra Vossa Divina Majestade.\n\nQuero, nesta novena, aprender as virtudes que, com tanta perfeição,\npraticou o glorioso Patriarca São José e alcançar,\npor sua intercessão, as graças de que tanto preciso.\n\nVenho, portanto, com toda a confiança, implorar a divina clemência,\nnão fiado em minha fraqueza, mas no poder e valimento de São José. Amém.\n\nÓ José, chamado por Jesus com o nome de pai,\nque dor e tormento indizível seria para vosso coração\nter perdido Jesus, com o qual estavam todas as afeições de vossa vida!\n\nVós perdestes a Jesus, sem culpa vossa,\nmas eu perdi-O muitas vezes por culpa própria.\n\nFazei-me conhecer a Jesus e procurá-Lo com perseverança.\nConsiga-me a graça de que, de hoje em diante,\nnunca mais eu O perca pelo pecado.\n\nIntercedei para que eu esteja sempre em união com Jesus e Sua santa Igreja.\nConsegui que Jesus esteja sempre em meu coração,\ne que no futuro eu possa gozar de Sua visão e amizade no céu para sempre. Amém.\n\nOração final (rezar todos os dias):\n\nLembrai-vos, ó puríssimo Esposo da Virgem Maria,\nó meu doce Protetor São José,\nque jamais se ouviu dizer que alguém tivesse invocado vossa proteção,\nimplorando vosso socorro e não fosse por vós consolado.\n\nCom grande confiança, venho a vossa presença recomendar-me fervorosamente a vós.\nNão desprezeis as minhas súplicas, ó pai adotivo do Redentor,\nmas dignai-vos acolhê-la piedosamente. Assim seja.\n\nV. Rogai por nós, José santíssimo.\nR. Para que sejamos dignos das promessas de Cristo.\n\nOremos: Ó Jesus, que por uma inefável providência,\ndignastes-Vos escolher o bem-aventurado esposo de Vossa Mãe Santíssima;\nconcedei-nos que aquele mesmo que veneramos como protetor,\nmereçamos tê-lo no céu por nosso intercessor.\nVós que viveis e reinais por todos os séculos dos séculos. Amém.\n\nRezar 7 Pais-Nossos, 7 Ave-Marias e 7 Glórias ao Pai\nem honra das alegrias e dores do glorioso patriarca."}
    ]

  {
    id:'josemaria', icon:'✨', title:'Novena do Trabalho — São Josemaria Escriva',
    sub:'Fundador do Opus Dei · 9 dias antes de 26 de junho', color:'#b8830a',
    intro:'Esta novena, composta com palavras do próprio São Josemaria Escriva, convida a santificar o trabalho profissional, oferecendo cada dia a Deus como caminho de salvacao e apostolado.',
    days:[
      {title:"Dia 1 — Trabalho, caminho e santidade", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nViemos chamar de novo a atencao para o exemplo de Jesus,\nque, durante trinta anos, permaneceu em Nazare trabalhando.\nNas maos de Jesus, o trabalho profissional\nconverte-se em tarefa divina, em trabalho redentor,\nem caminho de salvacao.\n\nAi onde estao os nossos irmaos, os homens,\nai onde estao as nossas aspiracoes, o nosso trabalho,\naos nossos amores, ai esta o lugar do nosso encontro cotidiano com Cristo.\nDeus nos espera a cada dia no trabalho.\n\n\u2014 Intencao \u2014\n\nPara que Deus me ajude a olhar para minha tarefa profissional\ncomo um caminho de santificacao e de servico aos outros,\nonde o meu Pai Deus me espera a toda a hora\ne me pede que imite Jesus quando trabalhava\ncomo carpinteiro em Nazare.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 2 — Trabalhar por amor a Deus", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nA dignidade do trabalho se baseia no Amor.\nO grande privilegio do homem e poder amar,\ntranscendendo assim o efemero e transitorio.\n\nFazei tudo por amor. Assim nao ha coisas pequenas: tudo e grande.\nA perseveranca nas pequenas coisas por amor e heroismo.\n\n\u2014 Intencao \u2014\n\nPara que Deus me ajude a compreender\nque o que da valor a qualquer trabalho honesto\ne o amor com que o fazemos:\nem primeiro lugar, amor a Deus, a quem oferecemos o trabalho;\ne amor ao proximo, a quem queremos servir e ser uteis.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 3 — Ordem e constancia no trabalho", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nComo e breve a duracao da nossa passagem pela Terra!\nNao e justo que malbaratemos o tempo.\nNao podemos desperdicar esta etapa do mundo\nque Deus confia a cada um de nos.\n\nQuando tiveres ordem, multiplicar-se-a o teu tempo\ne, portanto, poderas dar mais gloria a Deus,\ntrabalhando mais a seu servico.\n\n\u2014 Intencao \u2014\n\nPara que me esmere em aprimorar a virtude da ordem,\nde modo que consiga fazer tudo com pontualidade,\nintensidade e constancia, sem confusoes nem atrasos,\ndedicando de modo equilibrado os horarios convenientes a cada dever:\nvida espiritual, familia, profissao e relacoes sociais.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 4 — Trabalho bem acabado", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nNao podemos oferecer ao Senhor uma coisa que,\ndentro das pobres limitacoes humanas, nao seja perfeita,\nsem mancha, realizada com atencao ate nos minimos detalhes.\nDeus nao aceita trabalhos malfeitos.\n\nO trabalho de cada qual ha de ser uma oferenda digna\naos olhos do Criador: uma tarefa acabada, impecavel.\n\n\u2014 Intencao \u2014\n\nPara que Deus me ajude a colocar todo o empenho\nem realizar o meu trabalho com categoria,\ncom a maior perfeicao possivel,\nconvicto de que um trabalho mal feito nao pode ser santificado\npor lhe faltar amor, condicao imprescindivel\npara que qualquer atividade humana seja agradavel a Deus.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 5 — Todos os trabalhos honestos sao dignos", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nE hora de que todos nos, cristaos, anunciemos bem alto\nque o trabalho e um dom de Deus.\nO trabalho, todo trabalho,\ne testemunho da dignidade do homem.\n\nDiante de Deus, nenhuma ocupacao e em si grande ou pequena.\nTudo adquire o valor do Amor com que se realiza.\n\n\u2014 Intencao \u2014\n\nPara que Deus me ajude a nao desprezar nenhum trabalho honesto,\nmas realiza-lo com toda a responsabilidade,\nfazendo com que tenha a categoria\ndo trabalho que Jesus realizou na oficina de Nazare.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 6 — Trabalhar na companhia de Deus", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nDeves manter ao longo do dia uma constante conversa com o Senhor,\nque se alimente tambem das proprias incidencias da tua tarefa profissional.\n\nColoca na tua mesa de trabalho uma imagem de Nossa Senhora,\ne dirige-lhe o olhar ao comecares a tua tarefa,\nenquanto a realizas e ao termina-la.\nEla te alcancara a forca necessaria\npara fazeres da tua ocupacao um dialogo amoroso com Deus.\n\n\u2014 Intencao \u2014\n\nPara que Deus me faca compreender que Ele esta sempre ao meu lado\nenquanto estou trabalhando,\ne que eu me esforce em ter a presenca de Deus durante o trabalho,\nservindo-me discretamente de um pequeno crucifixo\nou de uma imagem de Nossa Senhora.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 7 — Amadurecer nas virtudes pelo trabalho", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nE toda uma trama de virtudes que se poe em jogo\nquando exercemos o nosso oficio com o proposito de sanifica-lo:\na fortaleza, para perseverarmos no trabalho;\na temperanca, para superarmos o comodismo e o egoismo;\na justica, para cumprirmos os nossos deveres;\na prudencia, para sabermos o que convem fazer.\nE tudo por Amor.\n\n\u2014 Intencao \u2014\n\nPara que Deus me ajude a desenvolver por meio do trabalho\nas virtudes cristas e a amadurecer espiritualmente.\nQue eu procure ser paciente e compreensivo,\nsimples e humilde, fugindo da vaidade e do exibicionismo;\nque eu faca tudo com pureza de coracao.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 8 — Trabalhar e servir os outros", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nAtraves dos vossos afazeres profissionais, realizados com responsabilidade,\nalem de vos sustentardes economicamente,\nprestais um servico diretissimo ao desenvolvimento da sociedade.\n\nQuando tiveres terminado o teu trabalho,\nfaz o do teu irmao, ajudando-o, por Cristo,\ncom tal delicadeza e naturalidade que nem mesmo o favorecido\nrepare que estas fazendo mais do que deves.\n\n\u2014 Intencao \u2014\n\nPara que Deus infunda na minha alma o desejo\nde fazer do meu trabalho nao uma atividade egoista,\nmas um servico aberto ao bem e a utilidade de muitos,\ncom a certeza de que esse ideal de servico aos outros\ndara um novo sentido, mais elevado e alegre, a minha vida.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."},
      {title:"Dia 9 — Fazer apostolado com o trabalho", oracao:"\u2014 Reflexao de Sao Josemaria Escriva \u2014\n\nO trabalho profissional e tambem apostolado,\nocasiao de entrega aos outros homens;\no momento de lhes revelar Cristo e leva-los a Deus Pai.\n\nFaze a tua vida normal; trabalha onde estas,\nprocurando cumprir os deveres do teu estado.\nSe leal, compreensivo com os outros e exigente contigo mesmo.\nSe mortificado e alegre. Esse sera o teu apostolado.\n\n\u2014 Intencao \u2014\n\nPara que Deus me ajude a ver, no meu ambiente de trabalho,\num campo aberto para a missao apostolica\nque Deus confia a todos os batizados,\naproveitando as oportunidades para ajudar colegas e amigos\na descobrirem as maravilhas da fe crista.\n\n\u2014 Oracao a Sao Josemaria \u2014\n\nO Deus, que por mediacao da Santissima Virgem Maria\nconcedestes inumeras gracas a Sao Josemaria, sacerdote,\nescolhendo-o como instrumento fidelissimo para fundar o Opus Dei,\ncaminho de santificacao no trabalho profissional\ne no cumprimento dos deveres cotidianos do cristao,\nfazei com que eu saiba tambem converter todos os momentos,\namar e servir com alegria e simplicidade a Igreja,\no Romano Pontifice e as almas,\niluminando os caminhos da Terra\ncom o resplendor da fe e do amor.\nConcedei-me por intercessao de Sao Josemaria\no favor que vos peco.\nAssim seja.\n\nPai Nosso, Ave-Maria, Gloria."}
    ]
  },

  {
    id:'natal', icon:'🌟', title:'Novena de Natal',
    sub:'Natividade do Senhor · 16 a 24 de dezembro', color:'#b8830a',
    intro:'Esta novena prepara o coracao para o Natal com meditacoes de Sao Leao Magno (461), um dos maiores papas da historia, cujos sermons sobre a Encarnacao sao joias da tradicao da Igreja.',
    days:[
      {title:"Dia 1 — Raiou o dia de uma redemcao nova", oracao:"\u2014 Antifona \u2014\n\nTocai a trombeta em Siao,\nque o dia do Senhor se aproxima!\nEis que Ele vem salvar-nos.\n\n\u2014 Oracao inicial \u2014\n\nSenhor, mostra o Teu poder e vem,\na fim de que sejamos protegidos\ncontra os perigos a que nossos pecados nos expoem.\nTu que, sendo Deus, vives e reinas com o Pai,\nna unidade do Espirito Santo,\npelos seculos dos seculos. Amen.\n\n3 Ave-Marias; 1 Pai-Nosso; 1 Gloria.\n\n\u2014 Meditacao de Sao Leao Magno \u2014\n\nCarissimos, deixemo-nos transportar de alegria\ne demos livre curso ao jubilo espiritual,\npois raiou para nos o dia de uma redemcao nova,\ndia longamente preparado, dia de felicidade eterna.\n\n\u2014 Oracao final \u2014\n\nO Menino Jesus, a Vos recorro e Vos suplico,\npela intercessao de Vossa Mae Santissima:\nassisti-me nesta necessidade,\nporque creio firmemente que a Vossa divindade pode me socorrer!\nEspero com toda a confianca obter a Vossa santa graca.\nAmo-vos de todo o meu coracao\ne com todas as forcas de minha alma.\nProponho-me nao mais Vos ofender\ne a Vos me ofeco, dispondo-me a sofrer\nantes de fazer-vos sofrer.\nQuero de agora em diante Vos servir com toda a fidelidade,\ne, pelo Vosso Amor, o Menino Deus,\namarei o meu proximo como a mim mesmo.\nConcedei-me, principalmente, a graca de Vos possuir eternamente\nna companhia de Maria Santissima e de Sao Jose,\npara Vos adorar com todos os anjos na Corte Celestial. Amen."},
      {title:"Dia 2 — Permanecei firmes na fe", oracao:"\u2014 Antifona \u2014\n\nTodo monte e colina serao arrasados;\nVem, Senhor, e nao tardes!\n\n\u2014 Oracao inicial \u2014\n\nSenhor, mostra o Teu poder e vem,\na fim de que sejamos protegidos\ncontra os perigos a que nossos pecados nos expoem.\nTu que, sendo Deus, vives e reinas com o Pai,\nna unidade do Espirito Santo,\npelos seculos dos seculos. Amen.\n\n3 Ave-Marias; 1 Pai-Nosso; 1 Gloria.\n\n\u2014 Meditacao de Sao Leao Magno \u2014\n\nCarissimos, animados da confianca que nasce de tao grande esperanca,\npermanecei firmes na fe sobre a qual fostes estabelecidos,\npara que o Tentador, de cujo dominio Cristo vos subtraiu,\nnao vos seduza novamente com algumas de suas ciladas.\n\n\u2014 Oracao final \u2014\n\nO Menino Jesus, a Vos recorro e Vos suplico,\npela intercessao de Vossa Mae Santissima:\nassisti-me nesta necessidade,\nporque creio firmemente que a Vossa divindade pode me socorrer!\nEspero com toda a confianca obter a Vossa santa graca.\nAmo-vos de todo o meu coracao\ne com todas as forcas de minha alma.\nProponho-me nao mais Vos ofender\ne a Vos me ofeco, dispondo-me a sofrer\nantes de fazer-vos sofrer.\nQuero de agora em diante Vos servir com toda a fidelidade,\ne, pelo Vosso Amor, o Menino Deus,\namarei o meu proximo como a mim mesmo.\nConcedei-me, principalmente, a graca de Vos possuir eternamente\nna companhia de Maria Santissima e de Sao Jose,\npara Vos adorar com todos os anjos na Corte Celestial. Amen."},
      {title:"Dia 3 — Unidos a Cristo nascido em nossa carne", oracao:"\u2014 Antifona \u2014\n\nTende o espirito alerta;\no Senhor nosso Deus se aproxima.\n\n\u2014 Oracao inicial \u2014\n\nSenhor, mostra o Teu poder e vem,\na fim de que sejamos protegidos\ncontra os perigos a que nossos pecados nos expoem.\nTu que, sendo Deus, vives e reinas com o Pai,\nna unidade do Espirito Santo,\npelos seculos dos seculos. Amen.\n\n3 Ave-Marias; 1 Pai-Nosso; 1 Gloria.\n\n\u2014 Meditacao de Sao Leao Magno \u2014\n\nHonrai com uma obediencia santa e sincera\no misterio sagrado e divino da restauracao do genero humano.\nUni-vos a Cristo, nascido em nossa carne,\na fim de merecerdes ver reinando em Sua majestade\nesse mesmo Deus de gloria.\n\n\u2014 Oracao final \u2014\n\nO Menino Jesus, a Vos recorro e Vos suplico,\npela intercessao de Vossa Mae Santissima:\nassisti-me nesta necessidade,\nporque creio firmemente que a Vossa divindade pode me socorrer!\nEspero com toda a confianca obter a Vossa santa graca.\nAmo-vos de todo o meu coracao\ne com todas as forcas de minha alma.\nProponho-me nao mais Vos ofender\ne a Vos me ofeco, dispondo-me a sofrer\nantes de fazer-vos sofrer.\nQuero de agora em diante Vos servir com toda a fidelidade,\ne, pelo Vosso Amor, o Menino Deus,\namarei o meu proximo como a mim mesmo.\nConcedei-me, principalmente, a graca de Vos possuir eternamente\nna companhia de Maria Santissima e de Sao Jose,\npara Vos adorar com todos os anjos na Corte Celestial. Amen."},

const STORE_KEY = 'oel_state_v1';
const SEED_KEY = 'oel_seeded_v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { checks:{}, customItems:{trabalho:[],oracao:[],estudos:[]}, weekAgenda:{}, calEvents:{} };
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e) {}
}

let store = loadStore();

  tab: 'rotina',

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function setTab(tab) {

/* ============ ROTINA: SEMANA / TIMELINE ============ */
function getWeekDates(baseKey) {
  const [y,m,d] = baseKey.split('-').map(Number);
  const base = new Date(y, m-1, d);
  const sunday = new Date(base);
  sunday.setDate(base.getDate() - base.getDay());
  const days = [];
  for (let i=0;i<7;i++) {
    const dt = new Date(sunday);
    dt.setDate(sunday.getDate()+i);
    days.push(dt);
  }
  return days;
}

function selectDay(key) {
  state.selectedDate = key;
  state.isAddingTimeline = false;
  render();
}

function startAddTimeline() {
  state.isAddingTimeline = true;
  state.draftTime = '';
  state.draftLabel = '';
  render();
}

function confirmTimeline() {
  const label = state.draftLabel.trim();
  if (!label) { state.isAddingTimeline = false; render(); return; }
  const time = state.draftTime.trim() || '--:--';
  const key = state.selectedDate;
  if (!store.weekAgenda[key]) store.weekAgenda[key] = [];
  store.weekAgenda[key].push({ time, label, person:'Ambos' });
  store.weekAgenda[key].sort((a,b)=>a.time.localeCompare(b.time));
  state.isAddingTimeline = false;
  saveStore();
  render();
}

function deleteTimelineItem(key, idx) {
  if (!store.weekAgenda[key]) return;
  store.weekAgenda[key].splice(idx,1);
  saveStore();
  render();
}

function onDraftTimeInput(v){ state.draftTime = v; }
function onDraftLabelInput(v){ state.draftLabel = v; }
function onTimelineKey(e){ if (e.key==='Enter') confirmTimeline(); }

function setRotinaCategory(id) {
  state.rotinaCategory = id;
  state.addingFor = null;

function toggleCheck(id) {
  store.checks[id] = !store.checks[id];
  saveStore();
  render();
}
function startAddItem(cat) {
  state.addingFor = cat;
  state.draftText = '';
  render();
}
function onDraftItemInput(v) { state.draftText = v; }
function onDraftItemKey(e) { if (e.key==='Enter') confirmAddItem(); }
function confirmAddItem() {
  const cat = state.addingFor;
  const text = state.draftText.trim();
  if (!cat || !text) { state.addingFor = null; render(); return; }
  if (!store.customItems[cat]) store.customItems[cat] = [];
  const id = 'custom-' + Date.now() + '-' + Math.floor(Math.random()*1000);
  store.customItems[cat].push({ id, period:'Geral', text, person:'Ambos' });
  state.addingFor = null;
  saveStore();
  render();
}
function deleteCustomItem(cat, id) {
  store.customItems[cat] = (store.customItems[cat]||[]).filter(it => it.id !== id);
  delete store.checks[id];
  saveStore();
  render();
}

/* ============ CALENDARIO ============ */
function calMonthShift(dir) {
  let m = state.calMonth + dir, y = state.calYear;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  state.calMonth = m; state.calYear = y;
  render();
}
function startAddCalEvent() {
  state.isAddingCalEvent = true;
  const t = new Date();
  state.draftCalDate = dateKey(t);
  state.draftCalLabel = '';

  if (!store.calEvents[key]) store.calEvents[key] = [];
